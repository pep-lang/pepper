# What scripts/pepper-tests.sh needs on a hosted runner, for CI's test-*
# jobs (ci.yml): LLVM, the libraries the tests link, the toolchain to test
# with, and PEPPER_TARGET_DIR and PEPPER_CACHE_DIR. With `compiler`
# (ci.yml's `changes` job decides, and its summary says why), the
# checkout's compiler is built, and PEPPER_COMPILER_DIR names it.
#
# Only the changed compiler's own build cache is carried between runs, a
# few hundred MB, so a rerun, or a run whose compiler sources a run before
# it built, takes seconds (scripts/ci-build-compiler.sh). The tests' builds start from
# an empty cache: their keys name the compiler that builds them, new in
# nearly every run (a PR's own, or the build of main a merge publishes),
# so carrying them saved no time, while restoring and saving 0.5 to 2 GB
# per OS cost minutes and evicted the other caches.
name: Prepare the Pepper tests
description: Provision a runner for scripts/pepper-tests.sh

inputs:
  compiler:
    description: "'true' to test the checkout's compiler instead of the installed one"
    required: true
  expect-commit:
    description: the commit the installed toolchain must be built from, or empty
    required: false
    default: ""
  token:
    description: a GitHub token, for the release downloads
    required: true

runs:
  using: composite
  steps:
    # Windows is the one platform with no package manager that ships a usable
    # LLVM, so it installs the minimal package published by the llvm-package
    # workflow (~450 MB) and falls back to the upstream archive (4 GB
    # extracted) if none exists yet. The cache covers whichever download
    # happens; its key tracks the setup script's hash, not a hardcoded
    # version, because a hardcoded key keeps hitting exactly after a version
    # bump and actions/cache skips its save on an exact hit -- so the new
    # archive would never be cached and every later run would re-download.
    - name: Cache LLVM download
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ~/AppData/Local/pepper/cache
        key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

    # apt and Homebrew serve the others in seconds, Linux from a cache of
    # apt's packages when it can (.github/actions/provision-llvm).
    - uses: ./.github/actions/provision-llvm
      with:
        token: ${{ inputs.token }}

    # Builds go beside the checkout. Every build shares one build cache
    # (PEPPER_CACHE_DIR):
    # the test programs', the tools', and those the tools' tests make in
    # their own folders, which then take the runtime's units from it. The
    # tests of the cache itself name their own.
    - name: Use a target dir and a build cache beside the checkout
      shell: bash
      run: |
        echo "PEPPER_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"
        echo "PEPPER_CACHE_DIR=$RUNNER_WORKSPACE/pepper-cache" >> "$GITHUB_ENV"

    # The runners share one $TMPDIR, which test folders left by crashed or
    # cancelled runs fill up. macOS's getcwd can scan every entry of a
    # folder's parent, so a build in a test folder there took minutes per
    # path once it held ~300k (tests timing out at 300 s). Older than a
    # day, none belongs to a running job.
    - name: Prune stale test folders
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        find "$TMPDIR" -maxdepth 1 \( -name 'pepper_*' -o -name 'pep-test-*' \) -mmin +1440 -exec rm -rf {} +

    # The digest tests link libcrypto under `-D USE_LIBCRYPTO`, and on Linux
    # the compress tests link zlib under `-D USE_ZLIB`
    # (scripts/pepper-tests.sh); macOS comes with zlib.
    - name: Provision libcrypto
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
    - name: Provision libcrypto and zlib
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euxo pipefail
        dpkg -s libssl-dev zlib1g-dev >/dev/null 2>&1 || sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends libssl-dev zlib1g-dev

    # The corpus also runs under wasmtime, built for wasm32-wasip1
    # (tools/compiler/corpus_test.pep), which fails here without them.
    - name: Provision wasi-sdk and wasmtime
      if: runner.os == 'Linux'
      shell: bash
      run: bash -euxo pipefail scripts/ci-provision-wasi.sh >> "$GITHUB_ENV"

    # The toolchain to test with: the published build of main, installed
    # with the install scripts.
    - name: Install the toolchain
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PEPPER_EXPECT_COMMIT: ${{ inputs.expect-commit }}
      run: bash -euxo pipefail scripts/ci-install-toolchain.sh

    # The compiler's build cache is keyed on stage 0, the installed
    # pep-build, by its contents (scripts/ci-build-compiler.sh names it so):
    # the newest entry made with this stage 0. One made with another stage
    # 0 has no key this build can use.
    - name: Name stage 0
      id: stage0
      if: inputs.compiler == 'true'
      shell: bash
      run: |
        set -euxo pipefail
        # Git's bash finds `pep-build` for `pep-build.exe`; git does not.
        compiler="$PEPPER_COMPILER_DIR/pep-build"
        [ ! -f "$compiler.exe" ] || compiler="$compiler.exe"
        echo "hash=$(git hash-object "$compiler")" >> "$GITHUB_OUTPUT"
    - name: Restore the compiler's build cache
      id: restore
      if: inputs.compiler == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.workspace }}/target-test/compiler
        key: pepper-compiler-${{ runner.os }}-${{ steps.stage0.outputs.hash }}-${{ github.run_id }}
        restore-keys: |
          pepper-compiler-${{ runner.os }}-${{ steps.stage0.outputs.hash }}-

    # A change to the compiler is tested with that compiler, built with
    # the installed one (scripts/ci-build-compiler.sh, the release's stage
    # 1).
    - name: Build the changed compiler
      if: inputs.compiler == 'true'
      shell: bash
      run: bash scripts/ci-monitor.sh 60 "$RUNNER_TEMP/monitor.txt" "$RUNNER_WORKSPACE" -- bash -euxo pipefail scripts/ci-build-compiler.sh

    # Saved by every run, pull requests' too, since it is small: the
    # repository keeps 10 GB of caches, which the tests' caches used to fill.
    # Not after a rerun, which restored this very key.
    - name: Save the compiler's build cache
      if: inputs.compiler == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.workspace }}/target-test/compiler
        key: pepper-compiler-${{ runner.os }}-${{ steps.stage0.outputs.hash }}-${{ github.run_id }}
