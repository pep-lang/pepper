# What scripts/pepper-tests.sh needs on a hosted runner, for CI's test-*
# jobs (ci.yml): LLVM, the libraries the tests link, the toolchain to test
# with, and PEPPER_TARGET_DIR and PEPPER_CACHE_DIR. With `compiler`
# (ci.yml's `changes` job decides, and its summary says why), the
# checkout's compiler is built, and PEPPER_COMPILER_DIR names it.
#
# Two build caches are carried between runs. The changed compiler's own,
# 350 MB to 1.2 GB, keyed on stage 0 and saved by main's runs only, so a
# run whose compiler sources main built takes seconds, and a pull
# request's rebuilds only what it changed (scripts/ci-build-compiler.sh).
# And, with `cache`, the tests' builds
# (PEPPER_CACHE_DIR, and the Pepper tools in target-test/pepper-tests),
# keyed on the compiler that builds them, by its contents, which ci.yml
# saves after the tests. pep-build's own keys name that compiler too (its
# path, size and time: scripts/pepper-tests.sh keeps the time of an
# unchanged one) and every source's contents, so an entry from another
# compiler or other sources is never reused, only rebuilt. A rerun, or a
# pull request's next push with the same compiler, starts warm; a new
# compiler starts empty. ci.yml's prune-caches job keeps only the newest
# entry of each per branch or pull request, and cache-cleanup.yml deletes
# a pull request's when it closes, so they stay well under the
# repository's 10 GB.
name: Prepare the Pepper tests
description: Provision a runner for scripts/pepper-tests.sh

inputs:
  compiler:
    description: "'true' to test the checkout's compiler instead of the installed one"
    required: true
  expect-commit:
    description: the commit the installed toolchain must be built from, or empty
    required: false
    default: ""
  token:
    description: a GitHub token, for the release downloads
    required: true
  cache:
    description: a name for the tests' build cache (ci.yml's part), restored here; empty for none
    required: false
    default: ""

outputs:
  cache-key:
    description: the key to save the tests' build cache under, when `cache` is set
    value: ${{ steps.tests-cache.outputs.key }}
  cache-hit:
    description: "'true' when the tests' build cache was restored under that very key (a rerun)"
    value: ${{ steps.restore-tests.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Windows is the one platform with no package manager that ships a usable
    # LLVM, so it installs the minimal package published by the llvm-package
    # workflow (~450 MB) and falls back to the upstream archive (4 GB
    # extracted) if none exists yet. The cache covers whichever download
    # happens; its key tracks the setup script's hash, not a hardcoded
    # version, because a hardcoded key keeps hitting exactly after a version
    # bump and actions/cache skips its save on an exact hit -- so the new
    # archive would never be cached and every later run would re-download.
    - name: Cache LLVM download
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ~/AppData/Local/pepper/cache
        key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-${{ runner.arch }}

    # apt and Homebrew serve the others in seconds, Linux from a cache of
    # apt's packages when it can (.github/actions/provision-llvm).
    - uses: ./.github/actions/provision-llvm
      with:
        token: ${{ inputs.token }}

    # Builds go beside the checkout. Every build shares one build cache
    # (PEPPER_CACHE_DIR):
    # the test programs', the tools', and those the tools' tests make in
    # their own folders, which then take the runtime's units from it. The
    # tests of the cache itself name their own.
    - name: Use a target dir and a build cache beside the checkout
      shell: bash
      run: |
        echo "PEPPER_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"
        echo "PEPPER_CACHE_DIR=$RUNNER_WORKSPACE/pepper-cache" >> "$GITHUB_ENV"

    # The runners share one $TMPDIR, which test folders left by crashed or
    # cancelled runs fill up. macOS's getcwd can scan every entry of a
    # folder's parent, so a build in a test folder there took minutes per
    # path once it held ~300k (tests timing out at 300 s). Older than a
    # day, none belongs to a running job.
    - name: Prune stale test folders
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        find "$TMPDIR" -maxdepth 1 \( -name 'pepper_*' -o -name 'pep-test-*' \) -mmin +1440 -exec rm -rf {} +

    # The digest tests link libcrypto under `-D USE_LIBCRYPTO`, and on Linux
    # the compress tests link zlib under `-D USE_ZLIB`
    # (scripts/pepper-tests.sh); macOS comes with zlib.
    - name: Provision libcrypto
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
    - name: Provision libcrypto and zlib
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euxo pipefail
        dpkg -s libssl-dev zlib1g-dev >/dev/null 2>&1 || sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends libssl-dev zlib1g-dev

    # The corpus also runs under wasmtime, built for wasm32-wasip1
    # (tools/compiler/corpus_test.pep), which fails here without them. Not
    # on arm64, which runs only the docs examples (ci.yml).
    - name: Provision wasi-sdk and wasmtime
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: bash -euxo pipefail scripts/ci-provision-wasi.sh >> "$GITHUB_ENV"

    # The toolchain to test with, installed with the install scripts: the
    # published build of main, or, to build the checkout's compiler with,
    # stage 0, the build .github/stage0 pins.
    - name: Install the toolchain
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PEPPER_EXPECT_COMMIT: ${{ inputs.expect-commit }}
        NEWEST: ${{ inputs.compiler != 'true' && '--newest' || '' }}
      run: bash -euxo pipefail scripts/ci-install-toolchain.sh $NEWEST

    # The compiler's build cache is keyed on stage 0, the installed
    # pep-build, by its contents (scripts/ci-build-compiler.sh names it so):
    # the newest entry made with this stage 0. One made with another stage
    # 0 has no key this build can use. Stage 0 is pinned, so every run
    # until the pin moves shares one key.
    - name: Name stage 0
      id: stage0
      if: inputs.compiler == 'true'
      shell: bash
      run: |
        set -euxo pipefail
        # Git's bash finds `pep-build` for `pep-build.exe`; git does not.
        compiler="$PEPPER_COMPILER_DIR/pep-build"
        [ ! -f "$compiler.exe" ] || compiler="$compiler.exe"
        echo "hash=$(git hash-object "$compiler")" >> "$GITHUB_OUTPUT"
    - name: Restore the compiler's build cache
      id: restore
      if: inputs.compiler == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.workspace }}/target-test/compiler
        key: pepper-compiler-${{ runner.os }}-${{ steps.stage0.outputs.hash }}-${{ github.run_id }}
        restore-keys: |
          pepper-compiler-${{ runner.os }}-${{ steps.stage0.outputs.hash }}-

    # A change to the compiler is tested with that compiler, built with
    # the installed one (scripts/ci-build-compiler.sh, the release's stage
    # 1).
    - name: Build the changed compiler
      id: build-compiler
      if: inputs.compiler == 'true'
      shell: bash
      run: bash scripts/ci-monitor.sh 15 "$RUNNER_TEMP/monitor.txt" "$RUNNER_WORKSPACE" -- bash -euxo pipefail scripts/ci-build-compiler.sh

    # Saved only by CI's runs on main, and only when the build changed it:
    # an entry is about 1.2 GB on Windows and 350 MB elsewhere, and the
    # repository keeps 10 GB of caches. A pull request restores main's
    # newest (actions/cache falls back to the base branch's entries), and
    # ci.yml's prune-caches job deletes the entries it replaced. Not after
    # a rerun, which restored this very key, and not from the mobile
    # workflow, whose jobs would save the same caches again.
    - name: Save the compiler's build cache
      if: inputs.compiler == 'true' && steps.restore.outputs.cache-hit != 'true' && steps.build-compiler.outputs.changed == 'true' && github.workflow == 'CI' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.workspace }}/target-test/compiler
        key: pepper-compiler-${{ runner.os }}-${{ steps.stage0.outputs.hash }}-${{ github.run_id }}

    # The tests' build cache (see the top), for the compiler the tests use.
    - name: Name the tests' build cache
      id: tests-cache
      if: inputs.cache != ''
      shell: bash
      env:
        PART: ${{ inputs.cache }}
      run: |
        set -euxo pipefail
        compiler="$PEPPER_COMPILER_DIR/pep-build"
        [ ! -f "$compiler.exe" ] || compiler="$compiler.exe"
        prefix="pepper-tests-$RUNNER_OS-$RUNNER_ARCH-$PART-$(git hash-object "$compiler")-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
    - name: Restore the tests' build cache
      id: restore-tests
      if: inputs.cache != ''
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ runner.workspace }}/pepper-cache
          ${{ runner.workspace }}/target-test/pepper-tests
        key: ${{ steps.tests-cache.outputs.key }}
        restore-keys: ${{ steps.tests-cache.outputs.prefix }}
