# LLVM 20 for a CI job (scripts/ci-provision-llvm.sh), with Linux's apt
# packages carried between runs: apt-get downloads about 89 MB of them from
# the runner's Ubuntu mirror, normally in seconds, but a slow mirror once
# took longer than the step's 15 minutes (#194). The cache holds the .deb
# files the last miss downloaded, keyed on the setup script (which pins the
# LLVM) and the image's Ubuntu release, and the script hands them to apt so
# it downloads none it has. The key ends in the run's id and is restored by
# prefix, so the newest entry wins and a set the image has moved past is
# replaced: the script refills the folder when apt had to download and says
# so, and only then is it saved. Only main saves it, so pull requests cannot fill
# the repository's 10 GB of caches with copies.
#
# Windows installs the package llvm-package.yml publishes, which
# downloads in seconds but takes about a minute to extract (424 MB, 185
# files), so the cache holds the installed tree instead: 113 MB on x64
# compressed, keyed on the setup script (which pins the LLVM) and the arch.
# A hit leaves the script's marker in place, so it installs nothing. The
# script says when it installed the package, and only then is it saved,
# so the multi-GB upstream archive it falls back to when no package is
# published is never cached. A pull request saves only on a miss: when
# it changes the setup script, or main has no entry yet.
#
# macOS installs Homebrew's llvm@20 and lld@20: the macos-15 image ships
# llvm@18, so each job downloaded and poured a 1.4 GB bottle, about 30s.
# The cache holds both kegs and their opt/ links instead, keyed on the
# setup script and the runner image's version, since the kegs link
# against libraries the image's Homebrew installed. With them in place
# setup-llvm.sh finds the LLVM and brew installs nothing. It is saved on a
# miss, on a pull request too, like Windows' cache.
#
# The caller bounds it with timeout-minutes; a composite step cannot.
name: Provision LLVM
description: Provision LLVM with scripts/ci-provision-llvm.sh, caching Linux's apt packages and the macOS and Windows installs

inputs:
  token:
    description: a GitHub token, for the release downloads on Windows
    required: true

runs:
  using: composite
  steps:
    - name: Name the Ubuntu release
      id: ubuntu
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euxo pipefail
        . /etc/os-release
        echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"

    - name: Restore LLVM's apt packages
      id: restore
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/llvm-debs
        key: llvm-debs-${{ hashFiles('scripts/setup-llvm.sh') }}-ubuntu-${{ steps.ubuntu.outputs.version }}-${{ runner.arch }}-${{ github.run_id }}
        restore-keys: llvm-debs-${{ hashFiles('scripts/setup-llvm.sh') }}-ubuntu-${{ steps.ubuntu.outputs.version }}-${{ runner.arch }}-

    - name: Restore LLVM's install
      id: restore-windows
      if: runner.os == 'Windows' && runner.environment == 'github-hosted'
      uses: actions/cache/restore@v6
      with:
        path: ~/AppData/Local/pepper/llvm
        key: llvm-windows-${{ hashFiles('scripts/setup-llvm.ps1') }}-${{ runner.arch }}

    - name: Name the macOS image
      id: macos
      if: runner.os == 'macOS' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        set -euxo pipefail
        echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

    # shortcut: the formulas' major is spelled out here; change it with the
    # LLVM pin in setup-llvm.sh (whose hash in the key then misses anyway).
    - name: Restore LLVM's kegs
      id: restore-macos
      if: runner.os == 'macOS' && runner.environment == 'github-hosted'
      uses: actions/cache/restore@v6
      with:
        path: |
          /opt/homebrew/Cellar/llvm@20
          /opt/homebrew/opt/llvm@20
          /opt/homebrew/Cellar/lld@20
          /opt/homebrew/opt/lld@20
        key: llvm-macos-${{ hashFiles('scripts/setup-llvm.sh') }}-${{ steps.macos.outputs.image }}-${{ runner.arch }}

    # Writes filled=true when it (re)filled the folder: on a miss, or when
    # apt had to download what the restored set lacked; on Windows, when it
    # installed the package.
    - name: Provision LLVM
      id: provision
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PEPPER_CI_LLVM_DEBS: ${{ runner.os == 'Linux' && format('{0}/llvm-debs', runner.temp) || '' }}
      run: bash scripts/ci-provision-llvm.sh

    - name: Save LLVM's apt packages
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.provision.outputs.filled == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/llvm-debs
        key: llvm-debs-${{ hashFiles('scripts/setup-llvm.sh') }}-ubuntu-${{ steps.ubuntu.outputs.version }}-${{ runner.arch }}-${{ github.run_id }}

    - name: Save LLVM's install
      if: runner.os == 'Windows' && runner.environment == 'github-hosted' && steps.provision.outputs.filled == 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/AppData/Local/pepper/llvm
        key: llvm-windows-${{ hashFiles('scripts/setup-llvm.ps1') }}-${{ runner.arch }}

    - name: Save LLVM's kegs
      if: runner.os == 'macOS' && runner.environment == 'github-hosted' && steps.restore-macos.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          /opt/homebrew/Cellar/llvm@20
          /opt/homebrew/opt/llvm@20
          /opt/homebrew/Cellar/lld@20
          /opt/homebrew/opt/lld@20
        key: llvm-macos-${{ hashFiles('scripts/setup-llvm.sh') }}-${{ steps.macos.outputs.image }}-${{ runner.arch }}
