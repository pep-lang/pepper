# Builds the pepper-lsp server (release) for every supported platform and
# packages it with the VSCode extension into a single downloadable .vsix.
#
# The LSP crate depends only on pepper-parser, pepper-sema and pepper-files,
# none of which link LLVM, so each matrix leg needs no LLVM provisioning:
# unlike the CI workflow it runs in seconds after checkout. Each leg builds
# natively on its own runner (no cross-compilation toolchains) and smoke-
# tests the binary it produced before uploading it.
#
# The vsix is published as a GitHub release asset, not a run artifact, so it
# stays available after the run's artifacts expire. The tag carries the
# extension version from tools/vscode-pepper/package.json: repeat pushes
# replace the asset on the existing release, and a version bump opens a new
# one. `pepper.lspPath` remains as a dev override for using your own build.
#
# It runs only for a release (pushing a vX.Y.Z tag, the same tags that
# publish the docs) or when dispatched by hand (`gh workflow run vsix.yml`).
# A release tag first runs the suite against every supported LLVM major
# (llvm-versions.yml) and builds nothing unless all pass.
# A release tag or a dispatch on main publishes; a dispatch on any other
# branch uploads the vsix as a run artifact instead, so a branch can be
# tested without replacing the released extension.
#
# Every leg runs on a self-hosted runner and must pass. There is no arm64
# Windows or Linux runner, so the vsix bundles no server for win32-arm64 or
# linux-arm64; on those platforms (and any other without a bundled server) the
# extension still highlights and tells the user how to point `pepper.lspPath`
# at their own build.
name: VSIX

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: vsix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A release tag first runs the suite against every supported LLVM major
  # (llvm-versions.yml); nothing is built or published unless all pass. A
  # dispatch skips it, so a branch build stays quick.
  llvm-versions:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/llvm-versions.yml

  build:
    needs: llvm-versions
    # Runs when the matrix passed, or was skipped because this is a dispatch.
    if: ${{ !cancelled() && (needs.llvm-versions.result == 'success' || needs.llvm-versions.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # One native runner per target, except macOS: both darwin legs run
        # on the self-hosted arm64 pepper-macos runner, and the x64 one names
        # its Rust target explicitly. Apple's toolchain links either arch
        # without extra setup, and Rosetta runs the x64 binary for the smoke
        # test. `rust-target` empty means the host target.
        include:
          - { target: win32-x64, runs-on: pepper-windows, exe: ".exe", rust-target: "" }
          - { target: linux-x64, runs-on: pepper-linux, exe: "", rust-target: "" }
          - { target: darwin-x64, runs-on: pepper-macos, exe: "", rust-target: x86_64-apple-darwin }
          - { target: darwin-arm64, runs-on: pepper-macos, exe: "", rust-target: "" }
    runs-on: ${{ matrix.runs-on }}
    # No LLVM download, so the budget is dominated by cargo.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Hosted images ship node; the self-hosted runners may not.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          node --version

      # ~/.cargo persists on self-hosted runners; only hosted ones need this.
      - name: Cache cargo registry
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      # Checkout's clean step deletes target/, so a self-hosted runner builds
      # beside the checkout instead, as in the CI workflow. One directory per
      # target keeps the two darwin legs, which share a runner, apart.
      - name: Use persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-vsix-${{ matrix.target }}" >> "$GITHUB_ENV"

      # Where the release binary lands: under CARGO_TARGET_DIR when set, and
      # under a per-triple directory when a Rust target is named.
      - name: Locate server binary
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          dir="${CARGO_TARGET_DIR:-target}"
          [ -n "$RUST_TARGET" ] && dir="$dir/$RUST_TARGET"
          echo "PEPPER_LSP_BIN=$dir/release/pepper-lsp${{ matrix.exe }}" >> "$GITHUB_ENV"

      # Release build, as required for the bundled server. No features: the
      # LSP crate never links LLVM, so -p selects exactly what to build.
      - name: Build pepper-lsp (release)
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: cargo build --release -p pepper-lsp --locked ${RUST_TARGET:+--target "$RUST_TARGET"}

      # Prove the binary that ships actually serves LSP requests before it is
      # packaged; the smoke test spawns it over stdio and exercises diagnostics,
      # hover, completion, go-to-definition and document symbols.
      - name: Smoke test release server
        shell: bash
        env:
          PEPPER_REPO_ROOT: ${{ github.workspace }}
        run: node tools/lsp/smoke-test.mjs tests/String.Methods/test.pep

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: pepper-lsp-${{ matrix.target }}
          path: ${{ env.PEPPER_LSP_BIN }}
          if-no-files-found: error

  package:
    runs-on: pepper-linux
    permissions:
      contents: write
    needs: build
    # Stated outright: a job whose upstream (llvm-versions) was skipped is
    # skipped by default, even when its own needs succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # npm ci + vsce packaging; no compilation here.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/vscode-pepper/package-lock.json

      # Every server binary that was built, one directory per artifact.
      - name: Collect server binaries
        uses: actions/download-artifact@v4
        with:
          path: servers

      # The extension resolves the bundled server at
      # server/<platform>-<arch>/pepper-lsp[.exe] (src/extension.js). Every
      # target is required.
      - name: Bundle servers into extension
        shell: bash
        run: |
          set -euo pipefail
          for target in win32-x64 linux-x64 darwin-x64 darwin-arm64; do
            if [ ! -d "servers/pepper-lsp-$target" ]; then
              echo "::error::no pepper-lsp server was built for $target"
              exit 1
            fi
            mkdir -p "tools/vscode-pepper/server/$target"
            cp "servers/pepper-lsp-$target/"* "tools/vscode-pepper/server/$target/"
          done
          # Artifact download does not preserve file permissions (files arrive
          # 644), and vsce zips with the on-disk mode, so restore the exec bit
          # or the POSIX binaries would be installed non-executable.
          chmod +x tools/vscode-pepper/server/*/pepper-lsp*
          find tools/vscode-pepper/server -type f -exec ls -l {} +

      # Bundle runtime dependencies so the vsix is self-contained.
      - name: Install extension dependencies
        working-directory: tools/vscode-pepper
        run: npm ci --no-audit --no-fund

      - name: Package vsix
        working-directory: tools/vscode-pepper
        run: npx --yes @vscode/vsce@3 package --out pepper-language.vsix

      # A branch dispatch keeps the vsix as a run artifact; main and release
      # tags publish.
      - name: Upload vsix (branch dispatch)
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v4
        with:
          name: pepper-language-vsix
          path: tools/vscode-pepper/pepper-language.vsix
          if-no-files-found: error

      # Publish the vsix as a release asset, tagged by the extension version
      # in package.json: repeat pushes replace the asset on the existing
      # release, a version bump opens a new one. The tag is read from the
      # file that owns it, never re-derived.
      - name: Publish to GitHub release
        if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./tools/vscode-pepper/package.json').version")
          tag="vsix-v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf '%s\n' \
              "VSCode extension for the Pepper language, built by the VSIX workflow." \
              "" \
              "Bundles a pepper-lsp server for win32-x64, linux-x64," \
              "darwin-x64 and darwin-arm64; nothing else is needed to" \
              "install it on those platforms." \
              > "$RUNNER_TEMP/notes.md"
            # A concurrent run (a superseded one cancel-in-progress has not
            # stopped yet, or a dispatch on another branch) may create the
            # release in between; treat "already exists" as success.
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Pepper Language v$version" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              || gh release view "$tag" >/dev/null
          fi
          gh release upload "$tag" tools/vscode-pepper/pepper-language.vsix --clobber

