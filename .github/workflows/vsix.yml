# Builds the pep-lsp server (tools/pep-lsp, written in Pepper; release
# build) for every supported platform and packages it with the VSCode
# extension into a single downloadable .vsix.
#
# Each leg installs the Pepper toolchain of this checkout's VERSION with the
# install scripts (scripts/ci-install-toolchain.sh, as CI does) and builds
# pep-lsp with its pep-build against this checkout's runtime. The server
# never links LLVM. Each leg builds natively on its own runner, except
# darwin-x64, which the arm64 Mac builds with `--target`, and smoke-tests
# the binary it produced before uploading it.
#
# The vsix is published as a GitHub release asset, not a run artifact, so it
# stays available after the run's artifacts expire. The tag carries the
# extension version from tools/vscode-pepper/package.json: repeat pushes
# replace the asset on the existing release, and a version bump opens a new
# one. `pepper.lspPath` remains as a dev override for using your own build.
#
# It runs only when dispatched: by release.yml on a vX.Y.Z tag once that
# release's archives are published, or by hand (`gh workflow run vsix.yml`).
# A tag push does not start it: its legs would wait for the release's
# toolchain on the same self-hosted runners the release builds on, and hold
# them, so neither could finish.
# A release tag or a dispatch on main publishes; a dispatch on any other
# branch uploads the vsix as a run artifact instead, so a branch can be
# tested without replacing the released extension.
#
# Every leg runs on a self-hosted runner and must pass. There is no arm64
# Windows or Linux runner, so the vsix bundles no server for win32-arm64 or
# linux-arm64; on those platforms (and any other without a bundled server) the
# extension still highlights and tells the user how to point `pepper.lspPath`
# at their own build.
name: VSIX

on:
  workflow_dispatch:

concurrency:
  group: vsix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # One native runner per target, except macOS: both darwin legs run
        # on the self-hosted arm64 pepper-macos runner, and the x64 one names
        # its target triple explicitly. Apple's toolchain links either arch
        # without extra setup, and Rosetta runs the x64 binary for the smoke
        # test. `triple` empty means the host.
        include:
          - { target: win32-x64, runs-on: pepper-windows, exe: ".exe", triple: "" }
          - { target: linux-x64, runs-on: pepper-linux, exe: "", triple: "" }
          - { target: darwin-x64, runs-on: pepper-macos, exe: "", triple: x86_64-apple-darwin }
          - { target: darwin-arm64, runs-on: pepper-macos, exe: "", triple: "" }
    runs-on: ${{ matrix.runs-on }}
    # Installing the toolchain and an optimized build of pep-lsp; a tag also
    # waits for release.yml to publish that toolchain.
    timeout-minutes: 200

    steps:
      - uses: actions/checkout@v7

      # Hosted images ship node; the self-hosted runners may not.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # For a tag, the toolchain of that release, which release.yml publishes
      # from the same push: retry until it has. Otherwise the newest build of
      # main. scripts/ci-install-toolchain.sh names its folder in
      # PEPPER_COMPILER_DIR.
      - name: Install the toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          version=""
          if [ "$TAG" = true ]; then
            version="$(tr -d '\r' < VERSION)"
          fi
          bash -euxo pipefail scripts/ci-install-toolchain.sh ${version:+--version "$version"}

      # Release build, as required for the bundled server, of this
      # checkout's tools/pep-lsp against this checkout's runtime. pep-lsp
      # depends on the private pepper-lsp package (scripts/ci-package-auth.sh).
      - name: Build pep-lsp (release)
        shell: bash
        env:
          PEPPER_LSP_DEPLOY_KEY: ${{ secrets.PEPPER_LSP_DEPLOY_KEY }}
          PEPPER_RUNTIME: ${{ github.workspace }}/runtime
          TRIPLE: ${{ matrix.triple }}
        run: |
          source scripts/ci-package-auth.sh
          set -euxo pipefail
          out="$RUNNER_TEMP/pep-lsp-${{ matrix.target }}"
          rm -rf "$out"
          mkdir -p "$out"
          "$PEPPER_COMPILER_DIR/pep-build${{ matrix.exe }}" -O --lto=full -I tools tools/pep-lsp/main.pep \
            -o "$out/pep-lsp${{ matrix.exe }}" --build "$out/build" ${TRIPLE:+--target "$TRIPLE"}
          rm -f "$out"/*.pdb "$out"/*.ilk
          echo "PEPPER_LSP_BIN=$out/pep-lsp${{ matrix.exe }}" >> "$GITHUB_ENV"

      # Prove the binary that ships actually serves LSP requests before it is
      # packaged; the smoke test spawns it over stdio and exercises diagnostics,
      # hover, completion, go-to-definition and document symbols.
      - name: Smoke test release server
        shell: bash
        env:
          PEPPER_REPO_ROOT: ${{ github.workspace }}
        run: node tools/pep-lsp/smoke-test.mjs tests/String.Methods/test.pep

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: pep-lsp-${{ matrix.target }}
          path: ${{ env.PEPPER_LSP_BIN }}
          if-no-files-found: error

  package:
    runs-on: pepper-linux
    permissions:
      contents: write
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # npm ci + vsce packaging; no compilation here.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode-pepper/package-lock.json

      # Every server binary that was built, one directory per artifact.
      - name: Collect server binaries
        uses: actions/download-artifact@v8
        with:
          path: servers

      # The extension resolves the bundled server at
      # server/<platform>-<arch>/pep-lsp[.exe] (src/extension.js). Every
      # target is required.
      - name: Bundle servers into extension
        shell: bash
        run: |
          set -euo pipefail
          for target in win32-x64 linux-x64 darwin-x64 darwin-arm64; do
            if [ ! -d "servers/pep-lsp-$target" ]; then
              echo "::error::no pep-lsp server was built for $target"
              exit 1
            fi
            mkdir -p "tools/vscode-pepper/server/$target"
            cp "servers/pep-lsp-$target/"* "tools/vscode-pepper/server/$target/"
          done
          # Artifact download does not preserve file permissions (files arrive
          # 644), and vsce zips with the on-disk mode, so restore the exec bit
          # or the POSIX binaries would be installed non-executable.
          chmod +x tools/vscode-pepper/server/*/pep-lsp*
          find tools/vscode-pepper/server -type f -exec ls -l {} +

      # Bundle runtime dependencies so the vsix is self-contained.
      - name: Install extension dependencies
        working-directory: tools/vscode-pepper
        run: npm ci --no-audit --no-fund

      # vsce wants the license beside package.json; the repository's own
      # LICENSE.md is the one to ship. `vscode:prepublish` bundles the
      # extension with esbuild.
      - name: Package vsix
        working-directory: tools/vscode-pepper
        run: |
          cp ../../LICENSE.md LICENSE.md
          npx --yes @vscode/vsce@3 package --out pepper-language.vsix

      # A branch dispatch keeps the vsix as a run artifact; main and release
      # tags publish.
      - name: Upload vsix (branch dispatch)
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v7
        with:
          name: pepper-language-vsix
          path: tools/vscode-pepper/pepper-language.vsix
          if-no-files-found: error

      # Publish the vsix as a release asset, tagged by the extension version
      # in package.json: repeat pushes replace the asset on the existing
      # release, a version bump opens a new one. The tag is read from the
      # file that owns it, never re-derived.
      - name: Publish to GitHub release
        if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./tools/vscode-pepper/package.json').version")
          tag="vsix-v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf '%s\n' \
              "VSCode extension for the Pepper language, built by the VSIX workflow." \
              "" \
              "Bundles a pep-lsp server for win32-x64, linux-x64," \
              "darwin-x64 and darwin-arm64; nothing else is needed to" \
              "install it on those platforms." \
              > "$RUNNER_TEMP/notes.md"
            # A concurrent run (a superseded one cancel-in-progress has not
            # stopped yet, or a dispatch on another branch) may create the
            # release in between; treat "already exists" as success.
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Pepper Language v$version" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              || gh release view "$tag" >/dev/null
          fi
          gh release upload "$tag" tools/vscode-pepper/pepper-language.vsix --clobber

