# Builds the Pepper toolchain for each platform and publishes it on the
# release, for the install scripts (scripts/install.sh, scripts/install.ps1)
# to download.
#
# Each leg runs scripts/release-build.sh, which builds `pep-build` and the
# other tools, lays them out as an install (bin/, runtime/), archives that as
# `pepper-<version>-<target>.tar.gz` (`.zip` on Windows) with a `.sha256`
# beside it, and smoke-tests the archive with scripts/release-smoke-test.sh:
# unpacked outside the checkout with no LLVM variables set, `pepper build`
# must build and run a program, and the binaries must load nothing a user
# might not have.
#
#   linux-x64     the self-hosted Linux runner, inside a manylinux_2_28 container, so the
#                 binaries need only glibc 2.28 (RHEL 8, Debian 10 and later)
#   macos-arm64   the self-hosted arm64 Mac
#   windows-x64   the self-hosted Windows runner
#
# What publishes:
#
#   a merge into main that changes the compiler, the runtime or the tools
#                 (the `paths` below) publishes the build of main (#713):
#                 the version main holds, a prerelease such as 0.4.0-dev,
#                 on the prerelease v0.4.0-dev, whose tag moves to the merge
#                 and whose assets are replaced. CI and the workers install
#                 it instead of building the compiler.
#   a vX.Y.Z tag  publishes that release, made by hand: the commit it tags
#                 must hold that version (scripts/set-version.sh).
#   a dispatch    on main with `publish` set publishes the build of main, as
#                 a merge does.
#
# Publishing puts the archives, their checksums, SHA256SUMS and the install
# scripts on the release, creating it if there is none yet. A pull request
# that changes the release scripts, or a dispatch without `publish`, builds
# and tests every leg as `dev` and keeps the archives as run artifacts.
name: Release

on:
  push:
    branches: [main]
    # Paths do not filter tag pushes: every vX.Y.Z tag publishes.
    tags: ['v*.*.*']
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - runtime/**
      - tools/**
      - scripts/release-build.sh
      - scripts/release-smoke-test.sh
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build of main (its x.y.z-dev prerelease)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-build.sh
      - scripts/release-smoke-test.sh
      - scripts/install.sh
      - scripts/install.ps1

# Builds of main publish one at a time. A run waiting behind another is
# replaced by a newer merge's, which publishes both merges' changes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # The version to build and whether to publish it, as a release or as the
  # prerelease build of main.
  version:
    runs-on: pepper-linux
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          held=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          echo "the checkout holds $held"
          version=dev
          publish=false
          prerelease=false
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            if [ "$version" != "$held" ]; then
              echo "::error::tag $REF_NAME is on a commit that holds version $held; run scripts/set-version.sh $version first"
              exit 1
            fi
            publish=true
            case "$version" in *-*) prerelease=true ;; esac
          elif [ "$REF" = refs/heads/main ] && { [ "$EVENT" = push ] || [ "$PUBLISH_INPUT" = true ]; }; then
            case "$held" in
              *-*)
                version="$held"
                publish=true
                prerelease=true
                ;;
              *)
                # Main holds a release's version between set-version.sh and
                # its tag; the tag publishes it.
                echo "main holds release $held, not a prerelease: nothing to publish"
                ;;
            esac
          fi
          echo "version=$version publish=$publish prerelease=$prerelease"
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runs-on: pepper-linux, container: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { target: macos-arm64, runs-on: pepper-macos, container: "" }
          # No macos-x64 leg: it needs an Intel Mac, and GitHub-hosted runners
          # spend the account's Actions quota in days. release-build.sh still
          # builds that target on one by hand.
          - { target: windows-x64, runs-on: pepper-windows, container: "" }
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    # LLVM provisioning plus a release build of the compiler, from cold. The
    # Linux leg builds its LLVM from source the first time (cached after).
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      # Checkout's clean step deletes target/, so a self-hosted runner builds
      # beside the checkout instead, as in the CI workflow.
      - name: Use persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-release" >> "$GITHUB_ENV"

      # The version, or `dev` for a build that publishes nothing.
      - name: Version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "PEPPER_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build, package and smoke-test
        shell: bash
        env:
          # ci-provision-llvm.sh reads the LLVM package from this repository's
          # releases on Windows.
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          # pep-build is pepc, which depends on the private pepper-llvm
          # package (scripts/ci-package-auth.sh).
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
        run: |
          source scripts/ci-package-auth.sh
          bash -euxo pipefail scripts/release-build.sh "$TARGET" "$PEPPER_VERSION" dist

      # Install the archive just built with the install script, which then
      # builds and runs a program with it. Without a terminal to ask on,
      # the script installs no prerequisites.
      - name: Test install.sh
        if: matrix.target != 'windows-x64'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          sh scripts/install.sh --archive "dist/pepper-$PEPPER_VERSION-$TARGET.tar.gz" \
            --prefix "$RUNNER_TEMP/pepper-home" --no-modify-path < /dev/null
          sh scripts/install.sh --uninstall --prefix "$RUNNER_TEMP/pepper-home"
          test ! -e "$RUNNER_TEMP/pepper-home"

      # Under Windows PowerShell 5.1, which `irm ... | iex` runs in on most
      # machines. This runner is a person's computer, so the script installs
      # no prerequisites here.
      - name: Test install.ps1
        if: matrix.target == 'windows-x64'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'pepper-home'
          .\scripts\install.ps1 -Archive "dist\pepper-$env:PEPPER_VERSION-windows-x64.zip" -Prefix $prefix -NoModifyPath -NoPrerequisites
          .\scripts\install.ps1 -Uninstall -Prefix $prefix
          if (Test-Path $prefix) { throw "$prefix is still there after -Uninstall" }

      # A container job runs as root: the files it leaves in the self-hosted
      # runner's folders must stay writable by the runner's own jobs.
      - name: Give the runner its folders back
        if: always() && matrix.container != ''
        shell: bash
        run: chmod -R a+rwX "$GITHUB_WORKSPACE" "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}" || true

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: pepper-${{ matrix.target }}
          path: |
            dist/pepper-*.tar.gz
            dist/pepper-*.zip
            dist/pepper-*.sha256
          if-no-files-found: error

  publish:
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: pepper-linux
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Collect archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          cd dist
          cat pepper-*.sha256 > SHA256SUMS
          cat SHA256SUMS
          if [ "$PRERELEASE" = true ]; then
            # The build of main: its tag moves to this commit, and its
            # assets, named the same each time, are replaced below.
            if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              gh api "repos/$REPO/git/refs/tags/$TAG" -X PATCH -f sha="$GITHUB_SHA" -F force=true > /dev/null
            else
              gh api "repos/$REPO/git/refs" -X POST -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            fi
            printf '%s\n' \
              "The build of main at $GITHUB_SHA: Pepper $TAG, replaced on each merge that changes the compiler, the runtime or the tools." \
              "" \
              "Install it with scripts/install.sh --version ${TAG#v} (Linux, macOS) or scripts/install.ps1 -Version ${TAG#v} (Windows)." \
              > "$RUNNER_TEMP/notes.md"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --prerelease --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release create "$TAG" --prerelease --verify-tag --title "Pepper $TAG" \
                --notes-file "$RUNNER_TEMP/notes.md" \
                || gh release view "$TAG" >/dev/null
            fi
          elif ! gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' \
              "Pepper $TAG." \
              "" \
              "Install it with scripts/install.sh (Linux, macOS) or scripts/install.ps1 (Windows);" \
              "see https://justinboswell.github.io/pepper/tools/install.html." \
              > "$RUNNER_TEMP/notes.md"
            # Another workflow on the same tag may create it in between.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Pepper $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" pepper-* SHA256SUMS ../scripts/install.sh ../scripts/install.ps1 --clobber

  # After a release, main starts the next minor version: a pull request that
  # sets X.(Y+1).0-dev (scripts/set-version.sh) and merges itself once its
  # checks pass (auto-merge), when main still holds the version just
  # released. A patch release made from a branch, or a release
  # main has already moved past, leaves main alone. A major version is
  # started by hand.
  #
  # A pull request opened with the workflow's own token starts no
  # workflows. With the RELEASE_BUMP_TOKEN secret (a token that can push
  # branches and open pull requests) it is opened with that token and CI
  # runs as for any other; without it, the job dispatches CI on the branch,
  # whose `test` check on that commit is what auto-merge waits for.
  bump:
    if: needs.version.outputs.publish == 'true' && needs.version.outputs.prerelease != 'true'
    needs: [version, publish]
    runs-on: pepper-linux
    permissions:
      actions: write
      contents: write
      pull-requests: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_BUMP_TOKEN || github.token }}

      - name: Open the pull request starting the next version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN || github.token }}
          HAS_BUMP_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN != '' }}
          RELEASED: ${{ needs.version.outputs.version }}
        run: |
          set -euxo pipefail
          held=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          if [ "$held" != "$RELEASED" ]; then
            echo "main holds $held, not $RELEASED: nothing to start"
            exit 0
          fi
          IFS=. read -r major minor _ <<< "$RELEASED"
          next="$major.$((minor + 1)).0-dev"
          branch="release/start-$next"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch exists already"
            exit 0
          fi
          git switch -c "$branch"
          bash scripts/set-version.sh "$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' \
            "Start $next" \
            "" \
            "v$RELEASED is released: main now builds and publishes $next (scripts/set-version.sh)." \
            > "$RUNNER_TEMP/message.txt"
          git commit -a -F "$RUNNER_TEMP/message.txt"
          git push origin "$branch"
          printf '%s\n' \
            "v$RELEASED is released. This sets main's version to \`$next\` (scripts/set-version.sh), so each merge publishes the \`v$next\` prerelease that CI installs." \
            > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Start $next" --body-file "$RUNNER_TEMP/body.md"
          if [ "$HAS_BUMP_TOKEN" != true ]; then
            gh workflow run ci.yml --ref "$branch"
          fi
          # It merges itself once its checks pass. Auto-merge must be allowed
          # in the repository's settings.
          if ! gh pr merge "$branch" --auto --squash; then
            echo "::warning::could not turn on auto-merge for $branch; allow auto-merge in the repository settings, or merge it by hand"
          fi
