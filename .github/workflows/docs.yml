# Publishes the documentation site (docs/, rendered by `pep-doc build`)
# to the gh-pages branch, one folder per version:
#
#   merge into main    -> dev/      (the unreleased docs, replaced each time;
#                                  run from CI after its release job)
#   push a tag vX.Y.Z  -> X.Y.Z/    (a release; the tag must match VERSION)
#
# Only the folder being built is replaced; every other version already on
# gh-pages is kept, so the docs of every release stay available. versions.json
# and index.html are regenerated from the folders present.
#
# GitHub Pages must be set to deploy from the gh-pages branch (Settings >
# Pages > Build and deployment > Deploy from a branch).
name: Docs

on:
  push:
    tags: ['v*.*.*']
  # A merge into main runs this from CI (ci.yml's `docs` job), after CI's
  # `release` job has published the build of main that builds pep-doc.
  workflow_call:
  workflow_dispatch:

# A group per ref: GitHub keeps one pending run per group and cancels the
# one before, so with one group for all, a merge into main queued behind a
# release's run would cancel the release's docs (#340). A newer dev build
# replacing a pending older one is fine. Runs of different refs may then
# publish at once: Publish rebuilds on the newer gh-pages when its push
# loses the race.
concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # To open an issue when a release's docs fail to publish.
  issues: write

# A container job leaves root-owned files in the checkout, and git then
# refuses it ("dubious ownership").
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -euxo pipefail {0}

    steps:
      - uses: actions/checkout@v7

      # mdBook's own release binary, unless the runner has one.
      - name: Install mdBook
        env:
          MDBOOK_VERSION: v0.4.52
        run: |
          if ! command -v mdbook; then
            mkdir -p "$RUNNER_TEMP/mdbook"
            curl --fail --location --silent --show-error --retry 3 \
              "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP/mdbook"
            echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/mdbook:$PATH"
          fi
          mdbook --version

      - name: Choose the version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            held="$(tr -d '\r' < VERSION)"
            if [ "$version" != "$held" ]; then
              echo "::error::tag $REF_NAME does not match the version $held in VERSION"
              exit 1
            fi
          else
            version=dev
          fi
          echo "DOCS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check out the published site
        run: |
          # A self-hosted runner keeps .git between runs; forget the last
          # run's worktree, whose folder checkout has already cleaned away.
          git worktree prune
          rm -rf site
          if git fetch --depth 1 origin gh-pages; then
            git worktree add site FETCH_HEAD
            git -C site switch -c gh-pages
          else
            git worktree add --detach site
            git -C site switch --orphan gh-pages
          fi

      # pep-doc is a Pepper program, built against this checkout's runtime
      # with the newest published build of main, also for a release
      # tag, whose own release may not be published yet. While a merge
      # republishes the build of main its archives are missing (the
      # v0.11.0 docs failed so, #340), so the install is tried again, then
      # with stage 0 (.github/stage0), whose archives never change.
      - name: Install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4; do
            bash scripts/ci-install-toolchain.sh --newest && exit 0
            echo "::warning::installing the newest build of main failed (attempt $attempt)"
            sleep 180
          done
          bash scripts/ci-install-toolchain.sh

      - name: Build pep-doc
        env:
          PEPPER_RUNTIME: ${{ github.workspace }}/runtime
        run: |
          mkdir -p target/docs-tools
          "$PEPPER_COMPILER_DIR/pep-build" -O tools/pep-doc/main.pep -o target/docs-tools/pep-doc

      - name: Build the docs
        run: target/docs-tools/pep-doc build --version "$DOCS_VERSION" --site site

      # pep-doc build replaces only this version's folder and regenerates
      # versions.json and index.html from the folders present, so after a
      # push another run made first, building again on its gh-pages keeps
      # both versions.
      - name: Publish
        run: |
          for attempt in 1 2 3 4 5; do
            git -C site add -A
            if git -C site diff --cached --quiet; then
              echo "docs $DOCS_VERSION unchanged"
              exit 0
            fi
            git -C site -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish docs $DOCS_VERSION from $GITHUB_SHA"
            git -C site push origin gh-pages && exit 0
            echo "::warning::gh-pages moved while publishing (attempt $attempt); building on it again"
            git -C site fetch --depth 1 origin gh-pages
            git -C site reset -q --hard FETCH_HEAD
            git -C site clean -q -fdx
            target/docs-tools/pep-doc build --version "$DOCS_VERSION" --site site
          done
          exit 1

      # A release's docs are built once, from its tag, so a failure there
      # leaves that version off the site until someone dispatches this
      # workflow again: say so where it is seen.
      - name: Report a release whose docs did not publish
        if: (failure() || cancelled()) && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The Docs run for $TAG failed, so its docs are not on the site: $RUN_URL"
            echo
            echo "Publish them once the cause is fixed:"
            echo
            echo '```bash'
            echo "gh workflow run docs.yml --ref $TAG"
            echo '```'
          } > "$RUNNER_TEMP/docs-issue.md"
          gh issue create --title "Docs for $TAG did not publish" --label bug --label documentation \
            --body-file "$RUNNER_TEMP/docs-issue.md"
