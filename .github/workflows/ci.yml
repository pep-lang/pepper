# Required check for merging into main: builds the workspace and runs the test
# suite on Windows, the platform the compiler is developed against.
#
# Other platforms are deliberately not part of this gate. The driver's codegen
# initializes only the x86 LLVM target, so a macOS arm64 runner cannot be green
# yet, and making it required would block every merge. Use the on-demand
# `platform-test` workflow (and the skill of the same name) to exercise other
# operating systems when a change warrants it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same ref makes older runs irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail fast on a warning-free build rather than letting warnings accumulate?
  # No: the port still carries known-dead code. Warnings stay visible in logs.
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: windows-latest
    # Provisioning LLVM costs ~5 minutes on a cold cache; the suite itself is
    # seconds. 45 leaves room for a slow download without hanging forever.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # Installs the minimal LLVM package published by the llvm-package
      # workflow (~450 MB) and falls back to a full upstream install (4 GB
      # extracted) if none exists yet. The cache covers whichever download
      # happens; its key tracks the setup script's hash, not a hardcoded
      # version, because a hardcoded key keeps hitting exactly after a version
      # bump and actions/cache skips its save on an exact hit -- so the new
      # archive would never be cached and every later run would re-download.
      - name: Cache LLVM download
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

      - name: Provision LLVM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-provision-llvm.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --workspace --locked

      # --workspace is required: the repo root is itself a package, so a bare
      # `cargo test` would run only its single integration test and skip every
      # crate under crates/.
      - name: Test
        run: cargo test --workspace --locked
