# Required check for merging into main: builds the workspace and runs the test
# suite on Windows, the platform the compiler is developed against, against the
# default LLVM version.
#
# `test-linux` and `test-macos` run the same suite on Linux and macOS against
# the default LLVM. Neither is a required check. The suite against every other
# LLVM major runs before a release, not on PRs: see llvm-versions.yml.
#
# Linux and macOS both work end to end -- the suite passes for the 18, 19 and
# 20 that apt serves and for all five majors via Homebrew, and each compiles,
# links and runs a program.
#
# Every job runs on a self-hosted runner: pepper-windows and pepper-linux (a
# Windows service and a WSL systemd service on the maintainer's machine) and
# pepper-macos (a launchd service on an arm64 Mac, with rustup and Homebrew
# llvm@20). The Linux runner has LLVM 18-20 preinstalled and may
# `sudo apt-get` to add others; the Mac adds other majors with brew.
#
# Draft PRs get only `test-linux`, as a quick check; `test` and `test-macos`
# are skipped until the PR is marked ready for review, which starts a full run.
# A PR that changes only prose skips every job (see `changes`).
#
# Pushes to main do not run CI: main must be up to date before a PR merges, so
# the merged commit is the one the PR already tested. Run it by hand
# (workflow_dispatch) when main needs a fresh result.
name: CI

on:
  pull_request:
    # The defaults plus ready_for_review, so leaving draft runs the full suite.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer commit on a PR makes its older runs irrelevant, so cancel them.
# Manual runs queue instead, so each one finishes with a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The build is warning-free; warnings are not made errors (a new rustc or
  # dependency release can add one), but a new one should be fixed, not left.
  RUST_BACKTRACE: 1
  # The self-hosted jobs build into a target dir that persists across runs of
  # every PR (see "Use persistent target dir"). Cargo's per-crate fingerprints
  # handle that, but rustc's incremental cache does not: switching between PR
  # branches, and runs cancelled mid-build by a newer push, left object files
  # referencing symbols from another branch (LNK1120 on #148, naming a function
  # that exists only in #140). Dependencies are still reused; only the
  # workspace crates rebuild in full, which is seconds.
  CARGO_INCREMENTAL: 0
  # The runners share hosts: pepper-windows and both pepper-linux runners are
  # one 32-core machine, and both pepper-macos runners one Mac. Left to
  # default, each test binary (and each test's parallel_map) runs one thread
  # per core, so concurrent jobs oversubscribe the host several times over.
  RUST_TEST_THREADS: 16

jobs:
  # Whether the PR touches anything the build or the tests read. A PR that
  # changes only prose (Markdown outside docs/src/SUMMARY.md and the generated
  # docs/src/reference/, which `pepper-docgen check` reads, or agent skills
  # under .agents/ and .claude/) skips every job below. A job skipped by its
  # `if` reports success, so the required `test` check still passes.
  # docs/examples/ is code: docs_examples_tests compiles and runs it.
  changes:
    runs-on: pepper-linux
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # A pull_request run checks out the merge commit, whose first parent is
      # the base; depth 2 is enough to diff the two.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            case "$path" in
              docs/src/SUMMARY.md|docs/src/reference/*) code=true ;;
              .agents/*|.claude/*|*.md) ;;
              *) code=true ;;
            esac
            echo "$path"
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    runs-on: pepper-windows
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Provisioning LLVM costs ~5 minutes on a cold cache; the suite itself is
    # seconds. 45 leaves room for a slow download without hanging forever.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # Windows is the one platform with no package manager that ships a usable
      # LLVM, so it installs the minimal package published by the llvm-package
      # workflow (~450 MB) and falls back to the upstream archive (4 GB
      # extracted) if none exists yet. The cache covers whichever download
      # happens; its key tracks the setup script's hash, not a hardcoded
      # version, because a hardcoded key keeps hitting exactly after a version
      # bump and actions/cache skips its save on an exact hit -- so the new
      # archive would never be cached and every later run would re-download.
      # Self-hosted runners keep the installed LLVM and the download cache on
      # disk, so restoring and saving them through actions/cache is pure cost.
      - name: Cache LLVM download
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

      - name: Provision LLVM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-provision-llvm.sh

      # ~/.cargo persists on self-hosted runners; only hosted ones need this.
      - name: Cache cargo registry
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Self-hosted runners keep their disk between jobs, but checkout's clean
      # step deletes target/, so every job rebuilt every dependency from scratch.
      # Build beside the checkout instead, where the clean cannot reach; cargo
      # then rebuilds only what changed. One directory per job keeps jobs that
      # build with different features from invalidating each other. Deleting
      # it is always safe: the next job just builds from scratch.
      - name: Use persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --workspace --locked

      # --workspace is required: the repo root is itself a package, so a bare
      # `cargo test` would run only its single integration test and skip every
      # crate under crates/.
      - name: Test
        run: cargo test --workspace --locked

      # docs/src/reference/ is generated from the runtime's doc comments; a
      # runtime change must regenerate it (`cargo run -p pepper-docgen --
      # reference`) in the same PR.
      - name: Standard library reference is current
        run: cargo run -p pepper-docgen --locked -- check

  # The suite on macOS against the default LLVM, from Homebrew. Not required:
  # the Windows job above is the merge gate.
  test-macos:
    runs-on: pepper-macos
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Provision LLVM
        shell: bash
        run: bash scripts/ci-provision-llvm.sh

      # See the test job: build beside the checkout, where its clean step
      # cannot reach, so cargo rebuilds only what changed.
      - name: Use persistent target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --locked

  # The suite on Linux against the default LLVM. Not required, and the only
  # job a draft PR runs, as a quick check. The other LLVM majors run before a
  # release, in llvm-versions.yml, not on every PR.
  test-linux:
    runs-on: pepper-linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    env:
      # Every build the tests make checks its build-cache hits: a unit whose
      # sources matched is generated anyway and must produce the cached code,
      # so an input missing from a unit's cache key fails here instead of
      # linking stale code. It doubles the cost of a warm build, so only this
      # job, which is not the required check, pays it.
      PEPPER_CACHE_VERIFY: 1

    steps:
      - uses: actions/checkout@v7

      # apt serves a complete LLVM dev install in seconds, so there is nothing
      # to cache and no archive to download. The major is named because the
      # build's default features expect it: left unset, setup would quietly
      # fall back to another installed major and the build would fail later.
      - name: Provision LLVM
        shell: bash
        env:
          PEPPER_LLVM_MAJOR: 20
        run: bash scripts/ci-provision-llvm.sh

      # See the test job: build beside the checkout, where its clean step
      # cannot reach, so cargo rebuilds only what changed.
      - name: Use persistent target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Every verification failure's message starts with "build cache:". Put
      # each one in the run's summary and as an annotation, and keep the log,
      # so a cache bug is recorded even when the PR is later fixed or closed.
      - name: Record build cache verification failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          failures=$(grep -n "build cache:" "$log" || true)
          [ -n "$failures" ] || exit 0
          {
            echo "## Build cache verification failures"
            echo
            echo '```'
            echo "$failures"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::error title=Build cache verification failed::${line#*:}"
          done <<< "$failures"

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-linux-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: ignore
          retention-days: 90
