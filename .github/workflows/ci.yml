# `test` is the gate: it passes only when
# `test-windows` -- the Pepper test suite (scripts/pepper-tests.sh) on
# Windows, the platform the compiler is developed against -- `test-linux`
# and `test-macos`, the same suite on Linux and macOS, all ran and passed on
# this commit (or the commit changes only prose; see `changes`). A cancelled or
# timed-out job fails the gate like a failed one. Every job uses LLVM 20, the
# one the compiler binds (scripts/setup-llvm.sh).
#
# Every job tests with the published build of main (#713): the toolchain
# release.yml builds on each merge, installed with the install scripts as a
# user installs it (scripts/ci-install-toolchain.sh). A commit that changes
# the compiler (tools/compiler/), or a dispatch on a branch other than main,
# is tested with its own compiler instead: each job
# builds it with the installed pep-build (scripts/ci-build-compiler.sh, the
# release's stage 1), and every later step uses it.
#
# Every job runs on a self-hosted runner: pepper-windows and pepper-linux (a
# Windows service and a WSL systemd service on the maintainer's machine) and
# pepper-macos (a launchd service on an arm64 Mac, with Homebrew llvm@20).
# The Linux runner has LLVM 20 preinstalled and may `sudo apt-get` to add
# packages.
#
# CI runs on each push to main (a merge) and by hand (workflow_dispatch),
# not on pull requests: the runners share the maintainer's machine, and a run
# per PR push queued behind itself. Test a PR before merging it with the
# pre-merge checks, or run CI on its branch from the Actions tab ("Run
# workflow", pick the branch) or `gh workflow run ci.yml --ref <branch>`.
#
# A skipped job reports success, so `test` is never a job that can be
# skipped: it always runs and fails unless `test-windows`, `test-linux` and
# `test-macos` succeeded, or the commit changes only prose (see `changes`).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs queue instead of cancelling, so each one finishes with a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Whether the commit touches anything the build or the tests read. A merge
  # that changes only prose (Markdown outside docs/src/SUMMARY.md and the
  # generated docs/src/reference/, which `pep-doc check` reads, or agent
  # skills under .agents/ and .claude/) skips every test job below.
  # docs/examples/ is code: tools/pep-doc/examples_test.pep builds and runs it.
  changes:
    runs-on: pepper-linux
    # It takes seconds. A run cancelled while this job is being handed to a
    # runner has hung here until the timeout, holding the next run (same
    # concurrency group) behind it, so keep the timeout short.
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      compiler: ${{ steps.classify.outputs.compiler }}
    steps:
      # Merges into main are squashed, so the commit's parent is the base;
      # depth 2 is enough to diff the two.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            # A dispatch tests everything. On main it uses main's published
            # compiler; on another branch (a PR) it builds the branch's.
            echo "code=true" >> "$GITHUB_OUTPUT"
            if [ "$REF" = "$DEFAULT" ]; then
              echo "compiler=false" >> "$GITHUB_OUTPUT"
            else
              echo "compiler=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          code=false
          compiler=false
          # The runner's checkout persists between runs, and a shallow one
          # can lack the parent: fetch it. Without the paths, everything is
          # tested; classifying no paths would pass the change untested.
          if ! git rev-parse -q --verify 'HEAD^1' >/dev/null; then
            git fetch --no-tags --deepen=1 origin "$GITHUB_SHA" || true
          fi
          if ! paths=$(git diff --name-only 'HEAD^1' HEAD); then
            echo "cannot diff the commit against its parent: testing everything"
            paths=""
            code=true
            compiler=true
          fi
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              tools/compiler/*) code=true; compiler=true ;;
              docs/src/SUMMARY.md|docs/src/reference/*) code=true ;;
              .agents/*|.claude/*|*.md) ;;
              *) code=true ;;
            esac
            echo "$path"
          done <<< "$paths"
          echo "code=$code compiler=$compiler"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

  test-windows:
    runs-on: pepper-windows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Provisioning LLVM costs ~5 minutes on a cold cache. 45 leaves room for
    # a slow download without hanging forever.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Windows is the one platform with no package manager that ships a usable
      # LLVM, so it installs the minimal package published by the llvm-package
      # workflow (~450 MB) and falls back to the upstream archive (4 GB
      # extracted) if none exists yet. The cache covers whichever download
      # happens; its key tracks the setup script's hash, not a hardcoded
      # version, because a hardcoded key keeps hitting exactly after a version
      # bump and actions/cache skips its save on an exact hit -- so the new
      # archive would never be cached and every later run would re-download.
      # Self-hosted runners keep the installed LLVM and the download cache on
      # disk, so restoring and saving them through actions/cache is pure cost.
      - name: Cache LLVM download
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

      - name: Provision LLVM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-provision-llvm.sh

      # Self-hosted runners keep their disk between jobs, but checkout's clean
      # step deletes target/, where scripts/pepper-tests.sh builds the tools
      # and the tests. Build beside the checkout instead, where the clean
      # cannot reach. Deleting it is always safe: the next job just builds
      # from scratch.
      - name: Use persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: echo "PEPPER_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      # The toolchain to test with: the published build of main, installed
      # with the install scripts (#713).
      - name: Install the toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -euxo pipefail scripts/ci-install-toolchain.sh

      # A change to the compiler is tested with that compiler: built here
      # with the installed one, it replaces it in PEPPER_COMPILER_DIR.
      - name: Build the changed compiler
        if: needs.changes.outputs.compiler == 'true'
        shell: bash
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
        run: |
          source scripts/ci-package-auth.sh
          bash -euxo pipefail scripts/ci-build-compiler.sh

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`.
      - name: Pepper tests
        shell: bash
        # tools/compiler and tools/pep-lsp depend on the private pepper-llvm
        # (#656) and pepper-lsp packages.
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
          PEPPER_LSP_DEPLOY_KEY: ${{ secrets.PEPPER_LSP_DEPLOY_KEY }}
        run: |
          source scripts/ci-package-auth.sh
          bash scripts/pepper-tests.sh "$PEPPER_COMPILER_DIR"

      # docs/src/reference/ is generated from the runtime's doc comments; a
      # runtime change must regenerate it (`pep-doc reference`) in the same
      # PR. The check also fails on an undocumented public runtime
      # declaration, and on a tool option missing from its page, reading the
      # tools the Pepper tests step built, pep-doc among them.
      - name: Documentation is current
        shell: bash
        run: '"${PEPPER_TARGET_DIR:-target}/pepper-tests/bin/pep-doc" check'

  # The suite on macOS against the default LLVM, from Homebrew. Required,
  # through `test` (see the top of this file).
  test-macos:
    runs-on: pepper-macos
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # 10 more for building a changed compiler.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Provision LLVM
        shell: bash
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach.
      - name: Use persistent target dir
        shell: bash
        run: echo "PEPPER_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      # The runners share one $TMPDIR, which test folders left by crashed or
      # cancelled runs fill up. macOS's getcwd can scan every entry of a
      # folder's parent, so a build in a test folder there took minutes per
      # path once it held ~300k (tests timing out at 300 s). Older than a
      # day, none belongs to a running job.
      - name: Prune stale test folders
        shell: bash
        run: |
          set -euxo pipefail
          find "$TMPDIR" -maxdepth 1 \( -name 'pepper_*' -o -name 'pep-test-*' \) -mmin +1440 -exec rm -rf {} +

      # The digest tests link Homebrew's libcrypto under `-D USE_LIBCRYPTO`
      # (#370, scripts/pepper-tests.sh); zlib comes with macOS.
      - name: Provision libcrypto
        shell: bash
        run: |
          set -euxo pipefail
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      # The toolchain to test with: the published build of main, installed
      # with the install scripts (#713).
      - name: Install the toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -euxo pipefail scripts/ci-install-toolchain.sh

      # A change to the compiler is tested with that compiler: built here
      # with the installed one, it replaces it in PEPPER_COMPILER_DIR.
      - name: Build the changed compiler
        if: needs.changes.outputs.compiler == 'true'
        shell: bash
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
        run: |
          source scripts/ci-package-auth.sh
          bash -euxo pipefail scripts/ci-build-compiler.sh

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`.
      - name: Pepper tests
        shell: bash
        # tools/compiler and tools/pep-lsp depend on the private pepper-llvm
        # (#656) and pepper-lsp packages.
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
          PEPPER_LSP_DEPLOY_KEY: ${{ secrets.PEPPER_LSP_DEPLOY_KEY }}
        run: |
          source scripts/ci-package-auth.sh
          bash scripts/pepper-tests.sh "$PEPPER_COMPILER_DIR"

  # The suite on Linux. Required: `test` gates on it.
  test-linux:
    runs-on: pepper-linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # 10 more for building a changed compiler.
    timeout-minutes: 35
    # build_cache_tests verify the cache (`--verify-cache`) on every
    # platform. Setting PEPPER_CACHE_VERIFY here would verify every build
    # the other tests make too, which doubles the cost of each warm build.

    steps:
      - uses: actions/checkout@v7

      # apt serves a complete LLVM dev install in seconds, so there is nothing
      # to cache and no archive to download.
      - name: Provision LLVM
        shell: bash
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach.
      - name: Use persistent target dir
        shell: bash
        run: echo "PEPPER_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      # The digest and compress tests also run with `-D USE_LIBCRYPTO` and
      # `-D USE_ZLIB` (#370, scripts/pepper-tests.sh), which link libcrypto
      # and zlib.
      - name: Provision libcrypto and zlib
        shell: bash
        run: |
          set -euxo pipefail
          dpkg -s libssl-dev zlib1g-dev >/dev/null 2>&1 || sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends libssl-dev zlib1g-dev

      # The toolchain to test with: the published build of main, installed
      # with the install scripts (#713).
      - name: Install the toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -euxo pipefail scripts/ci-install-toolchain.sh

      # A change to the compiler is tested with that compiler: built here
      # with the installed one, it replaces it in PEPPER_COMPILER_DIR.
      - name: Build the changed compiler
        if: needs.changes.outputs.compiler == 'true'
        shell: bash
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
        run: |
          source scripts/ci-package-auth.sh
          bash -euxo pipefail scripts/ci-build-compiler.sh

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`.
      - name: Pepper tests
        shell: bash
        # tools/compiler and tools/pep-lsp depend on the private pepper-llvm
        # (#656) and pepper-lsp packages.
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
          PEPPER_LSP_DEPLOY_KEY: ${{ secrets.PEPPER_LSP_DEPLOY_KEY }}
        run: |
          source scripts/ci-package-auth.sh
          bash scripts/pepper-tests.sh "$PEPPER_COMPILER_DIR"

      # Cross-compiling (`--target`): build a few examples for Linux arm64,
      # linking with lld and Ubuntu's arm64 sysroot, run them under qemu, and
      # check they print what the host build prints. Linking for the other
      # operating systems needs their SDKs: the cross-link jobs below do that.
      - name: Cross-compile for Linux arm64
        shell: bash
        # This checkout's runtime, not the installed toolchain's.
        env:
          PEPPER_RUNTIME: ${{ github.workspace }}/runtime
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends lld-20 qemu-user libc6-dev-arm64-cross libgcc-13-dev-arm64-cross
          # lld-20 names its linker ld.lld only in LLVM 20's folder; the
          # installed pep-build links with the clang on the PATH, which looks
          # for ld.lld there too.
          export PATH="/usr/lib/llvm-20/bin:$PATH"
          compiler="$PEPPER_COMPILER_DIR/pep-build"
          out="$RUNNER_TEMP/cross"
          rm -rf "$out"
          mkdir -p "$out"
          for example in hello interpolation-format maps-sorted json-structs threads-basics simd-basics; do
            "$compiler" "docs/examples/$example.pep" -o "$out/$example-host" --build "$out/build"
            "$compiler" --target aarch64-unknown-linux-gnu "docs/examples/$example.pep" -o "$out/$example-arm64" --build "$out/build"
            "$out/$example-host" > "$out/$example-host.txt"
            qemu-aarch64 -L /usr/aarch64-linux-gnu "$out/$example-arm64" > "$out/$example-arm64.txt"
            diff "$out/$example-host.txt" "$out/$example-arm64.txt"
          done
          # Every SIMD vector operation, on NEON.
          "$compiler" --target aarch64-unknown-linux-gnu tests/Simd.Basic/test.pep -o "$out/simd-arm64" --build "$out/build"
          test "$(qemu-aarch64 -L /usr/aarch64-linux-gnu "$out/simd-arm64")" = "simd ok"

  # Cross-linking for the other operating systems (#485): each host builds a
  # few examples for the other two, with `--target` and their system roots,
  # and each host runs what the others built for it and compares the output
  # with its own native build's. These do not gate merging.
  #
  # The system roots: Linux's glibc and macOS's SDK stubs come from the
  # runners themselves (ci-export-sysroot.sh, a few megabytes, handed over as
  # artifacts), and the Windows SDK and CRT from Microsoft's servers through
  # `xwin`, cached on the runner (ci-provision-cross.sh).
  cross-sysroots:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: pepper-linux
            os: linux
          - runner: pepper-macos
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Pack the system root
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-export-sysroot.sh "$RUNNER_TEMP/sysroot-${{ matrix.os }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: sysroot-${{ matrix.os }}
          path: ${{ runner.temp }}/sysroot-${{ matrix.os }}.tar.gz
          retention-days: 1

  cross-link:
    needs: [changes, cross-sysroots]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: pepper-linux
            os: linux
          - runner: pepper-macos
            os: macos
          - runner: pepper-windows
            os: windows
    runs-on: ${{ matrix.runner }}
    # A cold runner downloads the Windows SDK (or, on Windows, LLVM's
    # archive for lld) once; later runs find them in the cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Provision LLVM
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach. The test jobs' directory, so a runner builds once.
      - name: Use persistent target dir
        shell: bash
        run: echo "PEPPER_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: sysroot-*
          path: ${{ runner.temp }}/sysroots
          merge-multiple: true

      - name: Provision lld, the Windows SDK and the system roots
        timeout-minutes: 15
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-provision-cross.sh "$RUNNER_WORKSPACE/cross-cache" "$RUNNER_TEMP/sysroots"

      - name: Install the toolchain
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -euxo pipefail scripts/ci-install-toolchain.sh

      # See test-windows.
      - name: Build the changed compiler
        if: needs.changes.outputs.compiler == 'true'
        timeout-minutes: 20
        shell: bash
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
        run: |
          source scripts/ci-package-auth.sh
          bash -euxo pipefail scripts/ci-build-compiler.sh

      - name: Cross-link the examples
        timeout-minutes: 10
        shell: bash
        env:
          PEPPER_RUNTIME: ${{ github.workspace }}/runtime
        run: |
          set -euxo pipefail
          bash scripts/ci-cross-link.sh build "$PEPPER_COMPILER_DIR/pep-build" "$RUNNER_TEMP/cross-from-${{ matrix.os }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cross-from-${{ matrix.os }}
          path: ${{ runner.temp }}/cross-from-${{ matrix.os }}
          retention-days: 3

      - name: Diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          set +e
          env | grep -E '^(PEPPER_SYSROOT_|PEPPER_LLVM_PREFIX|PATH=)' | sort
          for tool in clang ld.lld ld64.lld lld-link; do
            echo "$tool: $(command -v "$tool" || echo missing)"
          done
          ls "$RUNNER_WORKSPACE/cross-cache" "$RUNNER_WORKSPACE/cross-cache/sysroots"
          ls "$RUNNER_TEMP/sysroots"
          [ -n "${PEPPER_SYSROOT_X86_64_PC_WINDOWS_MSVC:-}" ] && find "$PEPPER_SYSROOT_X86_64_PC_WINDOWS_MSVC" -maxdepth 6 -type d

  cross-run:
    needs: [changes, cross-link]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [pepper-linux, pepper-macos, pepper-windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: cross-from-*
          path: ${{ runner.temp }}/cross

      - name: Run what the other hosts built
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-cross-link.sh run "$RUNNER_TEMP/cross"

  # The gate. It always runs, even when the run is cancelled, so it can never
  # report the success a skipped job does: it passes only when test-windows,
  # test-linux and test-macos passed on this commit, or the commit changes
  # only prose. It runs on pepper-linux like the rest, never on a
  # GitHub-hosted runner, whose Actions quota the account spends in days.
  test:
    if: always()
    needs: [changes, test-windows, test-linux, test-macos]
    runs-on: pepper-linux
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WINDOWS: ${{ needs.test-windows.result }}
          LINUX: ${{ needs.test-linux.result }}
          MACOS: ${{ needs.test-macos.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=$CODE test-windows=$WINDOWS test-linux=$LINUX test-macos=$MACOS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes did not succeed ($CHANGES), so nothing was tested"
            exit 1
          fi
          if [ "$CODE" = "false" ]; then
            echo "prose-only change: no tests needed"
            exit 0
          fi
          if [ "$WINDOWS" != "success" ]; then
            echo "::error::test-windows did not pass ($WINDOWS)"
            exit 1
          fi
          if [ "$LINUX" != "success" ]; then
            echo "::error::test-linux did not pass ($LINUX)"
            exit 1
          fi
          if [ "$MACOS" != "success" ]; then
            echo "::error::test-macos did not pass ($MACOS)"
            exit 1
          fi
          echo "test-windows, test-linux and test-macos passed"
