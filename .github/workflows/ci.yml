# `test` is the gate: it passes only when
# `test-windows` -- the Pepper test suite (scripts/pepper-tests.sh) on
# Windows, the platform the compiler is developed against -- `test-linux`
# and `test-macos`, the same suite on Linux and macOS, all ran and passed on
# this commit (or the commit changes only prose; see `changes`). A cancelled or
# timed-out job fails the gate like a failed one. Every job uses LLVM 20, the
# one the compiler binds (scripts/setup-llvm.sh).
#
# Every job tests with the published build of main: the toolchain
# release.yml builds on each merge, installed with the install scripts as a
# user installs it (scripts/ci-install-toolchain.sh). On a push, this
# workflow runs Release itself (`release`) and the jobs that install the
# toolchain wait for it, so they install this merge's build, not the one
# before it; Docs (`docs`) waits the same way. A failed release does not
# stop them: they test with the newest build that did publish, and the run
# shows the release's failure beside their results. A commit that changes
# the compiler (tools/compiler/), a dispatch on a branch other than main, or
# a commit whose compiler the published build lacks (main's run that would
# have published it was cancelled; scripts/ci-published-compiler.sh)
# is tested with its own compiler instead: each test and cross-link job
# builds it with the installed pep-build (scripts/ci-build-compiler.sh,
# the release's stage 1), and every later step uses it.
#
# Every job runs on a GitHub-hosted runner: windows-2025, ubuntu-24.04 and
# macos-15 (arm64). Hosted runners start clean, so each job provisions LLVM
# (apt, Homebrew, or the llvm-package archive on Windows). Each test job
# starts from the build cache the previous run saved (actions/cache).
#
# CI runs on each pull request, on each push to main (a merge), and by
# hand (workflow_dispatch: `gh workflow run ci.yml --ref <branch>`). main's
# ruleset requires `test` to pass on a pull request before it merges, so
# auto-merge waits for it. A newer push to a pull request cancels its run
# in progress; on main and by hand, runs queue.
#
# A skipped job reports success, so `test` is never a job that can be
# skipped: it always runs and fails unless `test-windows`, `test-linux` and
# `test-macos` succeeded, or the commit changes only prose (see `changes`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's newer push replaces its run in progress; other runs
# queue instead of cancelling, so each one finishes with a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the commit touches anything the build or the tests read. A merge
  # that changes only prose (Markdown outside docs/src/SUMMARY.md and the
  # generated docs/src/reference/, which `pep-doc check` reads, or agent
  # skills under .agents/ and .claude/) skips every test job below.
  # docs/examples/ is code: tools/pep-doc/examples_test.pep builds and runs it.
  changes:
    runs-on: ubuntu-24.04
    # It takes seconds. A run cancelled while this job is being handed to a
    # runner has hung here until the timeout, holding the next run (same
    # concurrency group) behind it, so keep the timeout short.
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      compiler: ${{ steps.classify.outputs.compiler }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      # Merges into main are squashed, and a pull request's checkout is a
      # merge commit, so the commit's first parent is the base. Every commit
      # (without file contents), so scripts/ci-published-compiler.sh can
      # find the published build of main on the commit's history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          code=false
          compiler=false
          release=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # A dispatch tests everything. On main it uses main's published
            # compiler (unless it is stale, below); on another branch it
            # builds the branch's. A pull request is classified like a push:
            # its checkout is a merge commit whose first parent is the base,
            # so the diff below is the pull request's changes.
            code=true
            if [ "$REF" != "$DEFAULT" ]; then
              compiler=true
              why="build the branch's compiler: a dispatch on a branch"
            fi
          else
            # The runner's checkout persists between runs, and a shallow one
            # can lack the parent: fetch it. Without the paths, everything is
            # tested; classifying no paths would pass the change untested.
            if ! git rev-parse -q --verify 'HEAD^1' >/dev/null; then
              git fetch --no-tags --deepen=1 origin "$GITHUB_SHA" || true
            fi
            if ! paths=$(git diff --name-only 'HEAD^1' HEAD); then
              echo "cannot diff the commit against its parent: testing everything"
              paths=""
              code=true
              compiler=true
              release=true
              why="build the commit's compiler: it cannot be diffed against its parent"
            fi
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                tools/compiler/*)
                  code=true
                  compiler=true
                  why="build the commit's compiler: it changes tools/compiler/"
                  ;;
                docs/src/SUMMARY.md|docs/src/reference/*) code=true ;;
                .agents/*|.claude/*|*.md) ;;
                *) code=true ;;
              esac
              # What the build of main is made from (release.yml).
              case "$path" in
                VERSION|runtime/*|tools/*|scripts/release-build.sh|scripts/release-smoke-test.sh|.github/workflows/release.yml) release=true ;;
              esac
              echo "$path"
            done <<< "$paths"
          fi
          # A commit that leaves the compiler alone still needs its own when
          # the published build of main lacks a compiler change on its base
          # (a cancelled run on main publishes nothing).
          if [ "$code" = true ] && [ "$compiler" = false ]; then
            if ! why=$(bash -euxo pipefail scripts/ci-published-compiler.sh HEAD); then
              compiler=true
              [ -n "$why" ] || why="build the commit's compiler: the published build could not be checked (see the log)"
            fi
          fi
          [ "$code" = true ] || why="no tests: the commit changes only prose"
          echo "$why"
          printf '### Compiler\n\n```\n%s\n```\n' "$why" >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code compiler=$compiler release=$release"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # A merge that changes what the toolchain is built from publishes the
  # build of main (release.yml) before any job below installs it. A skipped
  # or failed release lets them go on with the newest published build.
  release:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.release == 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  # The docs of main, built with pep-doc from the build just published.
  docs:
    needs: release
    if: ${{ !cancelled() && github.event_name == 'push' }}
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml

  # The suite, one job per OS, so a run takes three runners: the free
  # org's are shared by every branch. The shared steps are in
  # .github/actions/prepare-tests, which also restores the newest earlier
  # run's build cache for the OS and saves this run's.
  test-windows:
    runs-on: windows-2025
    needs: [changes, release]
    # Runs after `release` whether it published, failed or was skipped.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    # The whole suite on one 4-core runner (3 on macOS), from a warm build
    # cache when an earlier run left one. The bounds are the slowest
    # passing runs plus a fifth (scripts/ci-monitor.sh's samples and the
    # Diagnostics step say what a job that hit one was doing).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-tests
        timeout-minutes: 30
        with:
          compiler: ${{ needs.changes.outputs.compiler }}
          expect-commit: ${{ needs.release.result == 'success' && github.sha || '' }}
          token: ${{ github.token }}

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`, with the runner's memory, disk and biggest
      # processes printed beside them each minute (scripts/ci-monitor.sh):
      # a runner that dies mid-test leaves what it ran out of in the log.
      - name: Pepper tests
        timeout-minutes: 95
        shell: bash
        run: |
          bash scripts/ci-monitor.sh 60 "$RUNNER_TEMP/monitor.txt" "$RUNNER_WORKSPACE" &
          monitor=$!
          trap 'kill "$monitor"' EXIT
          bash scripts/pepper-tests.sh "$PEPPER_COMPILER_DIR"

      # docs/src/reference/ is generated from the runtime's doc comments; a
      # runtime change must regenerate it (`pep-doc reference`) in the same
      # PR. The check also fails on an undocumented public runtime
      # declaration, and on a tool option missing from its page, reading the
      # tools the Pepper tests step built, pep-doc among them.
      - name: Documentation is current
        timeout-minutes: 5
        shell: bash
        run: '"$PEPPER_TARGET_DIR/pepper-tests/bin/pep-doc" check'

      # A failed, cancelled or timed-out job: the samples with the least
      # memory free, and every process, its age and size, the disks, and
      # on Linux the kernel's out-of-memory kills, as the job ended.
      - name: Diagnostics
        if: failure() || cancelled()
        timeout-minutes: 5
        shell: bash
        run: bash scripts/ci-monitor.sh --report "$RUNNER_TEMP/monitor.txt" "$RUNNER_WORKSPACE"

  # The suite on macOS against the default LLVM, from Homebrew. Required,
  # through `test` (see the top of this file).
  test-macos:
    runs-on: macos-15
    needs: [changes, release]
    # Runs after `release` whether it published, failed or was skipped.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    # The whole suite on one 4-core runner (3 on macOS), from a warm build
    # cache when an earlier run left one. The bounds are the slowest
    # passing runs plus a fifth (scripts/ci-monitor.sh's samples and the
    # Diagnostics step say what a job that hit one was doing).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-tests
        timeout-minutes: 30
        with:
          compiler: ${{ needs.changes.outputs.compiler }}
          expect-commit: ${{ needs.release.result == 'success' && github.sha || '' }}
          token: ${{ github.token }}

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`, with the runner's memory, disk and biggest
      # processes printed beside them each minute (scripts/ci-monitor.sh):
      # a runner that dies mid-test leaves what it ran out of in the log.
      - name: Pepper tests
        timeout-minutes: 95
        shell: bash
        env:
          # The hosted macOS runner has 7 GB. Uncapped, 8 tests at once each
          # checking 8 compilation units at once ran a 16 GB Mac out of
          # memory (214 pep-build processes).
          PEPC_COMPILATION_UNIT_JOBS: 2
        run: |
          bash scripts/ci-monitor.sh 60 "$RUNNER_TEMP/monitor.txt" "$RUNNER_WORKSPACE" &
          monitor=$!
          trap 'kill "$monitor"' EXIT
          bash scripts/pepper-tests.sh "$PEPPER_COMPILER_DIR" -j 3

      # A failed, cancelled or timed-out job: the samples with the least
      # memory free, and every process, its age and size, the disks, and
      # on Linux the kernel's out-of-memory kills, as the job ended.
      - name: Diagnostics
        if: failure() || cancelled()
        timeout-minutes: 5
        shell: bash
        run: bash scripts/ci-monitor.sh --report "$RUNNER_TEMP/monitor.txt" "$RUNNER_WORKSPACE"

  # The suite on Linux. Required: `test` gates on it.
  # build_cache_tests verify the cache (`--verify-cache`) on every
  # platform. Setting PEPPER_CACHE_VERIFY here would verify every build
  # the other tests make too, which doubles the cost of each warm build.
  test-linux:
    runs-on: ubuntu-24.04
    needs: [changes, release]
    # Runs after `release` whether it published, failed or was skipped.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    # The whole suite on one 4-core runner (3 on macOS), from a warm build
    # cache when an earlier run left one. The bounds are the slowest
    # passing runs plus a fifth (scripts/ci-monitor.sh's samples and the
    # Diagnostics step say what a job that hit one was doing).
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-tests
        timeout-minutes: 30
        with:
          compiler: ${{ needs.changes.outputs.compiler }}
          expect-commit: ${{ needs.release.result == 'success' && github.sha || '' }}
          token: ${{ github.token }}

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`, with the runner's memory, disk and biggest
      # processes printed beside them each minute (scripts/ci-monitor.sh):
      # a runner that dies mid-test leaves what it ran out of in the log.
      - name: Pepper tests
        timeout-minutes: 80
        shell: bash
        run: |
          bash scripts/ci-monitor.sh 60 "$RUNNER_TEMP/monitor.txt" "$RUNNER_WORKSPACE" &
          monitor=$!
          trap 'kill "$monitor"' EXIT
          bash scripts/pepper-tests.sh "$PEPPER_COMPILER_DIR"

      # Cross-compiling (`--target`): build a few examples for Linux arm64,
      # linking with lld and Ubuntu's arm64 sysroot, run them under qemu, and
      # check they print what the host build prints. Linking for the other
      # operating systems needs their SDKs: the cross-link jobs below do that.
      - name: Cross-compile for Linux arm64
        timeout-minutes: 10
        shell: bash
        # This checkout's runtime, not the installed toolchain's.
        env:
          PEPPER_RUNTIME: ${{ github.workspace }}/runtime
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends lld-20 qemu-user libc6-dev-arm64-cross libgcc-13-dev-arm64-cross
          # lld-20 names its linker ld.lld only in LLVM 20's folder; the
          # installed pep-build links with the clang on the PATH, which looks
          # for ld.lld there too.
          export PATH="/usr/lib/llvm-20/bin:$PATH"
          compiler="$PEPPER_COMPILER_DIR/pep-build"
          out="$RUNNER_TEMP/cross"
          rm -rf "$out"
          mkdir -p "$out"
          for example in hello interpolation-format maps-sorted json-structs threads-basics simd-basics; do
            "$compiler" "docs/examples/$example.pep" -o "$out/$example-host" --build "$out/build"
            "$compiler" --target aarch64-unknown-linux-gnu "docs/examples/$example.pep" -o "$out/$example-arm64" --build "$out/build"
            "$out/$example-host" > "$out/$example-host.txt"
            qemu-aarch64 -L /usr/aarch64-linux-gnu "$out/$example-arm64" > "$out/$example-arm64.txt"
            diff "$out/$example-host.txt" "$out/$example-arm64.txt"
          done
          # Every SIMD vector operation, on NEON.
          "$compiler" --target aarch64-unknown-linux-gnu tests/Simd.Basic/test.pep -o "$out/simd-arm64" --build "$out/build"
          test "$(qemu-aarch64 -L /usr/aarch64-linux-gnu "$out/simd-arm64")" = "simd ok"

      # A failed, cancelled or timed-out job: the samples with the least
      # memory free, and every process, its age and size, the disks, and
      # on Linux the kernel's out-of-memory kills, as the job ended.
      - name: Diagnostics
        if: failure() || cancelled()
        timeout-minutes: 5
        shell: bash
        run: bash scripts/ci-monitor.sh --report "$RUNNER_TEMP/monitor.txt" "$RUNNER_WORKSPACE"

  # Cross-linking for the other operating systems: each host builds a
  # few examples for the other two, with `--target` and their system roots,
  # and each host runs what the others built for it and compares the output
  # with its own native build's. These do not gate merging.
  #
  # The system roots: Linux's glibc and macOS's SDK stubs come from the
  # runners themselves (ci-export-sysroot.sh, a few megabytes, handed over as
  # artifacts), and the Windows SDK and CRT from Microsoft's servers through
  # `xwin`, cached on the runner (ci-provision-cross.sh).
  cross-sysroots:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          - runner: macos-15
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Pack the system root
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-export-sysroot.sh "$RUNNER_TEMP/sysroot-${{ matrix.os }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: sysroot-${{ matrix.os }}
          path: ${{ runner.temp }}/sysroot-${{ matrix.os }}.tar.gz
          retention-days: 1

  cross-link:
    needs: [changes, release, cross-sysroots]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.cross-sysroots.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          - runner: macos-15
            os: macos
          - runner: windows-2025
            os: windows
    runs-on: ${{ matrix.runner }}
    # A cold runner downloads the Windows SDK (or, on Windows, LLVM's
    # archive for lld) once; later runs find them in the cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Provision LLVM
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach. The test jobs' directory, so a runner builds once.
      - name: Use persistent target dir
        shell: bash
        run: echo "PEPPER_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: sysroot-*
          path: ${{ runner.temp }}/sysroots
          merge-multiple: true

      - name: Provision lld, the Windows SDK and the system roots
        timeout-minutes: 15
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-provision-cross.sh "$RUNNER_WORKSPACE/cross-cache" "$RUNNER_TEMP/sysroots"

      - name: Install the toolchain
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PEPPER_EXPECT_COMMIT: ${{ needs.release.result == 'success' && github.sha || '' }}
        run: bash -euxo pipefail scripts/ci-install-toolchain.sh

      # See test-windows.
      - name: Build the changed compiler
        if: needs.changes.outputs.compiler == 'true'
        timeout-minutes: 20
        shell: bash
        run: |
          bash -euxo pipefail scripts/ci-build-compiler.sh

      - name: Cross-link the examples
        timeout-minutes: 10
        shell: bash
        env:
          PEPPER_RUNTIME: ${{ github.workspace }}/runtime
        run: |
          set -euxo pipefail
          bash scripts/ci-cross-link.sh build "$PEPPER_COMPILER_DIR/pep-build" "$RUNNER_TEMP/cross-from-${{ matrix.os }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cross-from-${{ matrix.os }}
          path: ${{ runner.temp }}/cross-from-${{ matrix.os }}
          retention-days: 3

      - name: Diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          set +e
          env | grep -E '^(PEPPER_SYSROOT_|PEPPER_LLVM_PREFIX|PATH=)' | sort
          for tool in clang ld.lld ld64.lld lld-link; do
            echo "$tool: $(command -v "$tool" || echo missing)"
          done
          ls "$RUNNER_WORKSPACE/cross-cache" "$RUNNER_WORKSPACE/cross-cache/sysroots"
          ls "$RUNNER_TEMP/sysroots"
          [ -n "${PEPPER_SYSROOT_X86_64_PC_WINDOWS_MSVC:-}" ] && find "$PEPPER_SYSROOT_X86_64_PC_WINDOWS_MSVC" -maxdepth 6 -type d

  cross-run:
    needs: [changes, cross-link]
    # A skipped `release` upstream would skip this job without the explicit
    # result check.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.cross-link.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: cross-from-*
          path: ${{ runner.temp }}/cross

      - name: Run what the other hosts built
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-cross-link.sh run "$RUNNER_TEMP/cross"

  # The gate. It always runs, even when the run is cancelled, so it can never
  # report the success a skipped job does: it passes only when test-windows,
  # test-linux and test-macos passed on this commit, or the commit changes
  # only prose.
  test:
    if: always()
    needs: [changes, test-windows, test-linux, test-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WINDOWS: ${{ needs.test-windows.result }}
          LINUX: ${{ needs.test-linux.result }}
          MACOS: ${{ needs.test-macos.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=$CODE test-windows=$WINDOWS test-linux=$LINUX test-macos=$MACOS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes did not succeed ($CHANGES), so nothing was tested"
            exit 1
          fi
          if [ "$CODE" = "false" ]; then
            echo "prose-only change: no tests needed"
            exit 0
          fi
          if [ "$WINDOWS" != "success" ]; then
            echo "::error::test-windows did not pass ($WINDOWS)"
            exit 1
          fi
          if [ "$LINUX" != "success" ]; then
            echo "::error::test-linux did not pass ($LINUX)"
            exit 1
          fi
          if [ "$MACOS" != "success" ]; then
            echo "::error::test-macos did not pass ($MACOS)"
            exit 1
          fi
          echo "test-windows, test-linux and test-macos passed"
