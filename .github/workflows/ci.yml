# Required check for merging into main: `test`, a gate that passes only when
# `test-windows` -- the workspace build and test suite on Windows, the platform
# the compiler is developed against, against the default LLVM version --
# `test-macos` and `test-linux`, the same suite on macOS and Linux, all ran and
# passed on this commit (or the PR changes only prose; see `changes`). The
# suite against every other LLVM major runs before a release, not on PRs: see
# llvm-versions.yml.
#
# Linux and macOS both work end to end -- the suite passes for the 18, 19 and
# 20 that apt serves and for all five majors via Homebrew, and each compiles,
# links and runs a program.
#
# Every job runs on a self-hosted runner: pepper-windows and pepper-linux (a
# Windows service and a WSL systemd service on the maintainer's machine) and
# pepper-macos (a launchd service on an arm64 Mac, with rustup and Homebrew
# llvm@20). The Linux runner has LLVM 18-20 preinstalled and may
# `sudo apt-get` to add others; the Mac adds other majors with brew.
#
# Draft PRs run no build or tests (only `changes` and `test`, seconds each on
# pepper-linux) until the PR is marked ready for review, which starts a full
# run. The runners share the maintainer's machine, so
# draft pushes would otherwise queue behind and slow ready PRs. A PR that
# changes only prose skips them too (see `changes`). On a draft, `test`
# passes: a draft cannot merge, and a red check on every draft hid the
# failures that mattered.
#
# A skipped job reports success to branch protection, so the required check
# is never a job that can be skipped: `test` always runs and fails unless
# `test-windows`, `test-macos` and `test-linux` succeeded, the PR is prose
# only, or the PR is still a draft. Before it existed, #279
# merged untested: marking it ready and pushing raced, and a run whose event
# payload still said "draft" cancelled the ready run and skipped every job,
# which counted as a pass. For the same reason `changes` asks the API whether
# the PR is a draft now, rather than trusting the payload, and `test` asks
# again before passing a draft.
#
# A draft's passing `test` stays on its commit after the PR is marked ready,
# and the ready run's own `test` job does not exist until the three test jobs
# finish, so for those minutes the commit would read as tested. To close that
# window, `changes` on a ready PR first posts a `test` check run of its own,
# in progress, which holds the PR unmergeable; the gate completes it with its
# own verdict.
#
# Pushes to main do not run CI: main must be up to date before a PR merges, so
# the merged commit is the one the PR already tested. Run it by hand
# (workflow_dispatch) when main needs a fresh result.
name: CI

on:
  pull_request:
    # The defaults plus ready_for_review, so leaving draft runs the full suite.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer commit on a PR makes its older runs irrelevant, so cancel them.
# Manual runs queue instead, so each one finishes with a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The build is warning-free; warnings are not made errors (a new rustc or
  # dependency release can add one), but a new one should be fixed, not left.
  RUST_BACKTRACE: 1
  # The self-hosted jobs build into a target dir that persists across runs of
  # every PR (see "Use persistent target dir"). Cargo's per-crate fingerprints
  # handle that, but rustc's incremental cache does not: switching between PR
  # branches, and runs cancelled mid-build by a newer push, left object files
  # referencing symbols from another branch (LNK1120 on #148, naming a function
  # that exists only in #140). Dependencies are still reused; only the
  # workspace crates rebuild in full, which is seconds.
  CARGO_INCREMENTAL: 0
  # The runners share hosts: pepper-windows and both pepper-linux runners are
  # one 32-core machine, and both pepper-macos runners one Mac. Left to
  # default, each test binary (and each test's parallel_map) runs one thread
  # per core, so concurrent jobs oversubscribe the host several times over.
  RUST_TEST_THREADS: 16

jobs:
  # Whether the PR touches anything the build or the tests read. A PR that
  # changes only prose (Markdown outside docs/src/SUMMARY.md and the generated
  # docs/src/reference/, which `pepper-docgen check` reads, or agent skills
  # under .agents/ and .claude/) skips every test job below, and so does a
  # draft. docs/examples/ is code: docs_examples_tests compiles and runs it.
  changes:
    runs-on: pepper-linux
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      draft: ${{ steps.draft.outputs.draft }}
      code: ${{ steps.classify.outputs.code }}
      hold: ${{ steps.hold.outputs.id }}
    steps:
      # The PR's draft state now, from the API: the event payload is a
      # snapshot, and a push racing "ready for review" can deliver a payload
      # that still says draft after the PR has left it.
      - id: draft
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          draft=false
          if [ "$EVENT" = "pull_request" ]; then
            draft=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .draft)
          fi
          echo "draft=$draft"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      # A ready PR's head may still carry a passing `test` from a draft run.
      # Post an in-progress `test` check run on it now, so the PR cannot merge
      # on that stale pass while this run tests it; `test` completes it.
      - id: hold
        if: github.event_name == 'pull_request' && steps.draft.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/check-runs" -X POST \
            -f name=test -f head_sha="$SHA" -f status=in_progress \
            -f 'output[title]=Testing' \
            -f 'output[summary]=The CI run testing this commit has not finished.' \
            --jq .id)
          echo "id=$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # A pull_request run checks out the merge commit, whose first parent is
      # the base; depth 2 is enough to diff the two.
      - uses: actions/checkout@v7
        if: steps.draft.outputs.draft != 'true'
        with:
          fetch-depth: 2

      - id: classify
        if: steps.draft.outputs.draft != 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            case "$path" in
              docs/src/SUMMARY.md|docs/src/reference/*) code=true ;;
              .agents/*|.claude/*|*.md) ;;
              *) code=true ;;
            esac
            echo "$path"
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test-windows:
    runs-on: pepper-windows
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    # Provisioning LLVM costs ~5 minutes on a cold cache; the suite itself is
    # seconds. 45 leaves room for a slow download without hanging forever.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # Windows is the one platform with no package manager that ships a usable
      # LLVM, so it installs the minimal package published by the llvm-package
      # workflow (~450 MB) and falls back to the upstream archive (4 GB
      # extracted) if none exists yet. The cache covers whichever download
      # happens; its key tracks the setup script's hash, not a hardcoded
      # version, because a hardcoded key keeps hitting exactly after a version
      # bump and actions/cache skips its save on an exact hit -- so the new
      # archive would never be cached and every later run would re-download.
      # Self-hosted runners keep the installed LLVM and the download cache on
      # disk, so restoring and saving them through actions/cache is pure cost.
      - name: Cache LLVM download
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

      - name: Provision LLVM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-provision-llvm.sh

      # ~/.cargo persists on self-hosted runners; only hosted ones need this.
      - name: Cache cargo registry
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Self-hosted runners keep their disk between jobs, but checkout's clean
      # step deletes target/, so every job rebuilt every dependency from scratch.
      # Build beside the checkout instead, where the clean cannot reach; cargo
      # then rebuilds only what changed. One directory per job keeps jobs that
      # build with different features from invalidating each other. Deleting
      # it is always safe: the next job just builds from scratch.
      - name: Use persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --workspace --locked

      # --workspace is required: the repo root is itself a package, so a bare
      # `cargo test` would run only its single integration test and skip every
      # crate under crates/.
      - name: Test
        run: cargo test --workspace --locked

      # docs/src/reference/ is generated from the runtime's doc comments; a
      # runtime change must regenerate it (`cargo run -p pepper-docgen --
      # reference`) in the same PR.
      - name: Standard library reference is current
        run: cargo run -p pepper-docgen --locked -- check

  # The suite on macOS against the default LLVM, from Homebrew. Required:
  # `test` gates on it and on the Windows job above.
  test-macos:
    runs-on: pepper-macos
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Provision LLVM
        shell: bash
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach, so cargo rebuilds only what changed.
      - name: Use persistent target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --locked

  # The suite on Linux against the default LLVM. Required: `test` gates on it.
  # The other LLVM majors run before a release, in llvm-versions.yml, not on
  # every PR.
  test-linux:
    runs-on: pepper-linux
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    env:
      # Every build the tests make checks its build-cache hits: a unit whose
      # sources matched is generated anyway and must produce the cached code,
      # so an input missing from a unit's cache key fails here instead of
      # linking stale code. It doubles the cost of a warm build, so only this
      # job pays it.
      PEPPER_CACHE_VERIFY: 1

    steps:
      - uses: actions/checkout@v7

      # apt serves a complete LLVM dev install in seconds, so there is nothing
      # to cache and no archive to download. The major is named because the
      # build's default features expect it: left unset, setup would quietly
      # fall back to another installed major and the build would fail later.
      - name: Provision LLVM
        shell: bash
        env:
          PEPPER_LLVM_MAJOR: 20
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach, so cargo rebuilds only what changed.
      - name: Use persistent target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Every verification failure's message starts with "build cache:". Put
      # each one in the run's summary and as an annotation, and keep the log,
      # so a cache bug is recorded even when the PR is later fixed or closed.
      - name: Record build cache verification failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          failures=$(grep -n "build cache:" "$log" || true)
          [ -n "$failures" ] || exit 0
          {
            echo "## Build cache verification failures"
            echo
            echo '```'
            echo "$failures"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::error title=Build cache verification failed::${line#*:}"
          done <<< "$failures"

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-linux-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: ignore
          retention-days: 90

  # The required check. It always runs, even when the run is cancelled, so it
  # can never report the success a skipped job does: it passes only when
  # test-windows, test-macos and test-linux passed on this commit, the PR
  # changes only prose, or the PR is still a draft (a draft cannot merge;
  # marking it ready starts the run that tests it). It only reads the results
  # of the jobs it needs, and completes the in-progress `test` check run that
  # `changes` posted with the same verdict.
  test:
    if: always()
    needs: [changes, test-windows, test-macos, test-linux]
    runs-on: pepper-linux
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          CHANGES: ${{ needs.changes.result }}
          DRAFT: ${{ needs.changes.outputs.draft }}
          CODE: ${{ needs.changes.outputs.code }}
          HOLD: ${{ needs.changes.outputs.hold }}
          WINDOWS: ${{ needs.test-windows.result }}
          MACOS: ${{ needs.test-macos.result }}
          LINUX: ${{ needs.test-linux.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=$CHANGES draft=$DRAFT code=$CODE hold=$HOLD test-windows=$WINDOWS test-macos=$MACOS test-linux=$LINUX"

          verdict() {
            if [ "$CHANGES" != "success" ]; then
              echo "changes did not succeed ($CHANGES), so nothing was tested"
              return 1
            fi
            if [ "$DRAFT" = "true" ]; then
              # Ask again: if the PR left draft since `changes` looked, the
              # ready run decides, and this run must not leave a pass behind.
              if [ "$EVENT" = "pull_request" ] &&
                [ "$(gh api "repos/$REPO/pulls/$NUMBER" --jq .draft)" != "true" ]; then
                echo "the PR left draft during this run; the ready run tests it"
                return 1
              fi
              echo "draft PR: tests run once it is marked ready for review"
              return 0
            fi
            if [ "$CODE" = "false" ]; then
              echo "prose-only change: no tests needed"
              return 0
            fi
            if [ "$WINDOWS" != "success" ]; then
              echo "test-windows did not pass ($WINDOWS)"
              return 1
            fi
            if [ "$MACOS" != "success" ]; then
              echo "test-macos did not pass ($MACOS)"
              return 1
            fi
            if [ "$LINUX" != "success" ]; then
              echo "test-linux did not pass ($LINUX)"
              return 1
            fi
            echo "test-windows, test-macos and test-linux passed"
            return 0
          }

          status=0
          message=$(verdict) || status=$?
          if [ "$status" = 0 ]; then
            conclusion=success
            echo "$message"
          else
            conclusion=failure
            echo "::error::$message"
          fi
          if [ -n "$HOLD" ]; then
            gh api "repos/$REPO/check-runs/$HOLD" -X PATCH \
              -f status=completed -f conclusion="$conclusion" \
              -f 'output[title]=Tested' -f "output[summary]=$message" > /dev/null
          fi
          exit "$status"
