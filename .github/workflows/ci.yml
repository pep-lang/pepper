# Required check for merging into main: `test`, a gate that passes only when
# `test-windows` -- the workspace build and test suite on Windows, the platform
# the compiler is developed against, against the default LLVM version -- and
# `test-linux`, the same suite on Linux, both ran and passed on this commit (or
# the PR changes only prose; see `changes`). `test-macos` runs the suite on
# macOS too but does not gate merging for now: it takes twice as long as the
# others and held up the merge queue. The
# suite against every other LLVM major runs before a release, not on PRs: see
# llvm-versions.yml.
#
# Linux and macOS both work end to end -- the suite passes for the 18, 19 and
# 20 that apt serves and for all five majors via Homebrew, and each compiles,
# links and runs a program.
#
# Every job runs on a self-hosted runner: pepper-windows and pepper-linux (a
# Windows service and a WSL systemd service on the maintainer's machine) and
# pepper-macos (a launchd service on an arm64 Mac, with rustup and Homebrew
# llvm@20). The Linux runner has LLVM 18-20 preinstalled and may
# `sudo apt-get` to add others; the Mac adds other majors with brew.
#
# Draft PRs run no build or tests (only `changes` and `test`, seconds each on
# pepper-linux) until the PR is marked ready for review, which starts a full
# run. The runners share the maintainer's machine, so
# draft pushes would otherwise queue behind and slow ready PRs. A PR that
# changes only prose skips them too (see `changes`). On a draft, `test`
# passes: a draft cannot merge, and a red check on every draft hid the
# failures that mattered.
#
# A skipped job reports success to branch protection, so the required check
# is never a job that can be skipped: `test` always runs and fails unless
# `test-windows` and `test-linux` succeeded, the PR is prose
# only, or the PR is still a draft. Before it existed, #279
# merged untested: marking it ready and pushing raced, and a run whose event
# payload still said "draft" cancelled the ready run and skipped every job,
# which counted as a pass. For the same reason `changes` asks the API whether
# the PR is a draft now, rather than trusting the payload, and `test` asks
# again before passing a draft.
#
# A draft's passing `test` stays on its commit after the PR is marked ready,
# and the ready run's own `test` job does not exist until the three test jobs
# finish, so for those minutes the commit would read as tested. To close that
# window, `changes` on a ready PR first posts a `test` check run of its own,
# in progress, which holds the PR unmergeable; the gate completes it with its
# own verdict.
#
# Pushes to main do not run CI: main must be up to date before a PR merges, so
# the merged commit is the one the PR already tested. Run it by hand
# (workflow_dispatch) when main needs a fresh result.
name: CI

on:
  pull_request:
    # The defaults plus ready_for_review, so leaving draft runs the full suite.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer commit on a PR makes its older runs irrelevant, so cancel them.
# Manual runs queue instead, so each one finishes with a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The build is warning-free; warnings are not made errors (a new rustc or
  # dependency release can add one), but a new one should be fixed, not left.
  RUST_BACKTRACE: 1
  # The self-hosted jobs build into a target dir that persists across runs of
  # every PR (see "Use persistent target dir"). Cargo's per-crate fingerprints
  # handle that, but rustc's incremental cache does not: switching between PR
  # branches, and runs cancelled mid-build by a newer push, left object files
  # referencing symbols from another branch (LNK1120 on #148, naming a function
  # that exists only in #140). Dependencies are still reused; only the
  # workspace crates rebuild in full, which is seconds.
  CARGO_INCREMENTAL: 0
  # The runners share hosts: pepper-windows and both pepper-linux runners are
  # one 32-core machine, and both pepper-macos runners one Mac. Left to
  # default, each test binary (and each test's parallel_map) runs one thread
  # per core, so concurrent jobs oversubscribe the host several times over.
  RUST_TEST_THREADS: 16

jobs:
  # Whether the PR touches anything the build or the tests read. A PR that
  # changes only prose (Markdown outside docs/src/SUMMARY.md and the generated
  # docs/src/reference/, which `pep-doc check` reads, or agent skills
  # under .agents/ and .claude/) skips every test job below, and so does a
  # draft. docs/examples/ is code: tools/pep-doc/examples_test.pep builds and
  # runs it.
  changes:
    runs-on: pepper-linux
    # It takes seconds. A run cancelled while this job is being handed to a
    # runner has hung here until the timeout, holding the PR's next run (same
    # concurrency group) behind it, so keep the timeout short.
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      draft: ${{ steps.draft.outputs.draft }}
      code: ${{ steps.classify.outputs.code }}
      hold: ${{ steps.hold.outputs.id }}
    steps:
      # The PR's draft state now, from the API: the event payload is a
      # snapshot, and a push racing "ready for review" can deliver a payload
      # that still says draft after the PR has left it.
      - id: draft
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          draft=false
          if [ "$EVENT" = "pull_request" ]; then
            draft=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .draft)
          fi
          echo "draft=$draft"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      # A ready PR's head may still carry a passing `test` from a draft run.
      # Post an in-progress `test` check run on it now, so the PR cannot merge
      # on that stale pass while this run tests it; `test` completes it.
      - id: hold
        if: github.event_name == 'pull_request' && steps.draft.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/check-runs" -X POST \
            -f name=test -f head_sha="$SHA" -f status=in_progress \
            -f 'output[title]=Testing' \
            -f 'output[summary]=The CI run testing this commit has not finished.' \
            --jq .id)
          echo "id=$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # A pull_request run checks out the merge commit, whose first parent is
      # the base; depth 2 is enough to diff the two.
      - uses: actions/checkout@v7
        if: steps.draft.outputs.draft != 'true'
        with:
          fetch-depth: 2

      - id: classify
        if: steps.draft.outputs.draft != 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            case "$path" in
              docs/src/SUMMARY.md|docs/src/reference/*) code=true ;;
              .agents/*|.claude/*|*.md) ;;
              *) code=true ;;
            esac
            echo "$path"
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test-windows:
    runs-on: pepper-windows
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    # Provisioning LLVM costs ~5 minutes on a cold cache; the suite itself is
    # seconds. 45 leaves room for a slow download without hanging forever.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # Windows is the one platform with no package manager that ships a usable
      # LLVM, so it installs the minimal package published by the llvm-package
      # workflow (~450 MB) and falls back to the upstream archive (4 GB
      # extracted) if none exists yet. The cache covers whichever download
      # happens; its key tracks the setup script's hash, not a hardcoded
      # version, because a hardcoded key keeps hitting exactly after a version
      # bump and actions/cache skips its save on an exact hit -- so the new
      # archive would never be cached and every later run would re-download.
      # Self-hosted runners keep the installed LLVM and the download cache on
      # disk, so restoring and saving them through actions/cache is pure cost.
      - name: Cache LLVM download
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

      - name: Provision LLVM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-provision-llvm.sh

      # ~/.cargo persists on self-hosted runners; only hosted ones need this.
      - name: Cache cargo registry
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Self-hosted runners keep their disk between jobs, but checkout's clean
      # step deletes target/, so every job rebuilt every dependency from scratch.
      # Build beside the checkout instead, where the clean cannot reach; cargo
      # then rebuilds only what changed. One directory per job keeps jobs that
      # build with different features from invalidating each other. Deleting
      # it is always safe: the next job just builds from scratch.
      - name: Use persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      # The compiler and the docs tools, optimized: the Pepper tests compile
      # every test program with this pep-build. The Rust tests (`cargo test`)
      # no longer run in CI: the tests that matter are Pepper tests (#662).
      - name: Build
        run: cargo build --workspace --release --locked

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`.
      - name: Pepper tests
        shell: bash
        # tools/compiler depends on the private pepper-llvm package (#656).
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
        run: |
          source scripts/ci-pepper-llvm-auth.sh
          bash scripts/pepper-tests.sh

      # docs/src/reference/ is generated from the runtime's doc comments; a
      # runtime change must regenerate it (`pep-doc reference`) in the same
      # PR. The check also fails on an undocumented public runtime
      # declaration, and on a tool option missing from its page, reading the
      # tools the Pepper tests step built, pep-doc among them.
      - name: Documentation is current
        shell: bash
        run: '"${CARGO_TARGET_DIR:-target}/release/pep-doc" check'

  # The suite on macOS against the default LLVM, from Homebrew. Not required
  # for now: `test` does not wait for it (see the top of this file).
  test-macos:
    runs-on: pepper-macos
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Provision LLVM
        shell: bash
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach, so cargo rebuilds only what changed.
      - name: Use persistent target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      # The digest tests link Homebrew's libcrypto under `-D USE_LIBCRYPTO`
      # (#370, scripts/pepper-tests.sh); zlib comes with macOS.
      - name: Provision libcrypto
        shell: bash
        run: |
          set -euxo pipefail
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Build
        run: cargo build --workspace --release --locked

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`.
      - name: Pepper tests
        shell: bash
        # tools/compiler depends on the private pepper-llvm package (#656).
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
        run: |
          source scripts/ci-pepper-llvm-auth.sh
          bash scripts/pepper-tests.sh

  # The suite on Linux against the default LLVM. Required: `test` gates on it.
  # The other LLVM majors run before a release, in llvm-versions.yml, not on
  # every PR.
  test-linux:
    runs-on: pepper-linux
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    # build_cache_tests verify the cache (`--verify-cache`) on every
    # platform. Setting PEPPER_CACHE_VERIFY here would verify every build
    # the other tests make too, which doubles the cost of each warm build.

    steps:
      - uses: actions/checkout@v7

      # apt serves a complete LLVM dev install in seconds, so there is nothing
      # to cache and no archive to download. The major is named because the
      # build's default features expect it: left unset, setup would quietly
      # fall back to another installed major and the build would fail later.
      - name: Provision LLVM
        shell: bash
        env:
          PEPPER_LLVM_MAJOR: 20
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach, so cargo rebuilds only what changed.
      - name: Use persistent target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      # The digest and compress tests also run with `-D USE_LIBCRYPTO` and
      # `-D USE_ZLIB` (#370, scripts/pepper-tests.sh), which link libcrypto
      # and zlib.
      - name: Provision libcrypto and zlib
        shell: bash
        run: |
          set -euxo pipefail
          dpkg -s libssl-dev zlib1g-dev >/dev/null 2>&1 || sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends libssl-dev zlib1g-dev

      - name: Build
        run: cargo build --workspace --release --locked

      # The runtime's and the Pepper tools' own tests, `[Test]` functions run
      # by `pepper test`.
      - name: Pepper tests
        shell: bash
        # tools/compiler depends on the private pepper-llvm package (#656).
        env:
          PEPPER_LLVM_DEPLOY_KEY: ${{ secrets.PEPPER_LLVM_DEPLOY_KEY }}
        run: |
          source scripts/ci-pepper-llvm-auth.sh
          bash scripts/pepper-tests.sh

      # Cross-compiling (`--target`): build a few examples for Linux arm64,
      # linking with lld and Ubuntu's arm64 sysroot, run them under qemu, and
      # check they print what the host build prints. Linking for the other
      # operating systems needs their SDKs: the cross-link jobs below do that.
      - name: Cross-compile for Linux arm64
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends lld-20 qemu-user libc6-dev-arm64-cross libgcc-13-dev-arm64-cross
          compiler="$CARGO_TARGET_DIR/release/pep-build"
          out="$RUNNER_TEMP/cross"
          rm -rf "$out"
          mkdir -p "$out"
          for example in hello interpolation-format maps-sorted json-structs threads-basics simd-basics; do
            "$compiler" "docs/examples/$example.pep" -o "$out/$example-host" --build "$out/build"
            "$compiler" --target aarch64-unknown-linux-gnu "docs/examples/$example.pep" -o "$out/$example-arm64" --build "$out/build"
            "$out/$example-host" > "$out/$example-host.txt"
            qemu-aarch64 -L /usr/aarch64-linux-gnu "$out/$example-arm64" > "$out/$example-arm64.txt"
            diff "$out/$example-host.txt" "$out/$example-arm64.txt"
          done
          # Every SIMD vector operation, on NEON.
          "$compiler" --target aarch64-unknown-linux-gnu tests/Simd.Basic/test.pep -o "$out/simd-arm64" --build "$out/build"
          test "$(qemu-aarch64 -L /usr/aarch64-linux-gnu "$out/simd-arm64")" = "simd ok"

  # Cross-linking for the other operating systems (#485): each host builds a
  # few examples for the other two, with `--target` and their system roots,
  # and each host runs what the others built for it and compares the output
  # with its own native build's. Like test-macos, these do not gate merging.
  #
  # The system roots: Linux's glibc and macOS's SDK stubs come from the
  # runners themselves (ci-export-sysroot.sh, a few megabytes, handed over as
  # artifacts), and the Windows SDK and CRT from Microsoft's servers through
  # `xwin`, cached on the runner (ci-provision-cross.sh).
  cross-sysroots:
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: pepper-linux
            os: linux
          - runner: pepper-macos
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Pack the system root
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-export-sysroot.sh "$RUNNER_TEMP/sysroot-${{ matrix.os }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: sysroot-${{ matrix.os }}
          path: ${{ runner.temp }}/sysroot-${{ matrix.os }}.tar.gz
          retention-days: 1

  cross-link:
    needs: [changes, cross-sysroots]
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: pepper-linux
            os: linux
          - runner: pepper-macos
            os: macos
          - runner: pepper-windows
            os: windows
    runs-on: ${{ matrix.runner }}
    # A cold runner downloads the Windows SDK (or, on Windows, LLVM's
    # archive for lld) once; later runs find them in the cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Provision LLVM
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PEPPER_LLVM_MAJOR: 20
        run: bash scripts/ci-provision-llvm.sh

      # See test-windows: build beside the checkout, where its clean step
      # cannot reach. The test jobs' directory, so a runner builds once.
      - name: Use persistent target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target-test" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: sysroot-*
          path: ${{ runner.temp }}/sysroots
          merge-multiple: true

      - name: Provision lld, the Windows SDK and the system roots
        timeout-minutes: 15
        shell: bash
        env:
          PEPPER_LLVM_MAJOR: 20
        run: |
          set -euxo pipefail
          bash scripts/ci-provision-cross.sh "$RUNNER_WORKSPACE/cross-cache" "$RUNNER_TEMP/sysroots"

      - name: Build the compiler
        timeout-minutes: 15
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --locked --bin pep-build

      - name: Cross-link the examples
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-cross-link.sh build "$CARGO_TARGET_DIR/debug/pep-build" "$RUNNER_TEMP/cross-from-${{ matrix.os }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cross-from-${{ matrix.os }}
          path: ${{ runner.temp }}/cross-from-${{ matrix.os }}
          retention-days: 3

      - name: Diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          set +e
          env | grep -E '^(PEPPER_SYSROOT_|LLVM_SYS_|PATH=)' | sort
          for tool in clang ld.lld ld64.lld lld-link; do
            echo "$tool: $(command -v "$tool" || echo missing)"
          done
          ls "$RUNNER_WORKSPACE/cross-cache" "$RUNNER_WORKSPACE/cross-cache/sysroots"
          ls "$RUNNER_TEMP/sysroots"
          [ -n "${PEPPER_SYSROOT_X86_64_PC_WINDOWS_MSVC:-}" ] && find "$PEPPER_SYSROOT_X86_64_PC_WINDOWS_MSVC" -maxdepth 6 -type d

  cross-run:
    needs: [changes, cross-link]
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [pepper-linux, pepper-macos, pepper-windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: cross-from-*
          path: ${{ runner.temp }}/cross

      - name: Run what the other hosts built
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/ci-cross-link.sh run "$RUNNER_TEMP/cross"

  # The required check. It always runs, even when the run is cancelled, so it
  # can never report the success a skipped job does: it passes only when
  # test-windows and test-linux passed on this commit, the PR
  # changes only prose, or the PR is still a draft (a draft cannot merge;
  # marking it ready starts the run that tests it). It only reads the results
  # of the jobs it needs, and completes the in-progress `test` check run that
  # `changes` posted with the same verdict.
  #
  # When a need was cancelled (a newer push cancels the PR's older runs), the
  # verdict is a foregone failure, so it runs on a GitHub-hosted runner
  # instead. On pepper-linux each cancelled run queued behind the long
  # test-linux jobs: twenty stale runs once sat queued for hours ahead of a
  # release build. Skipping it instead would be unsafe: a skipped `test` on a
  # cancelled run of the PR's latest commit would count as passing.
  test:
    if: always()
    needs: [changes, test-windows, test-linux]
    runs-on: ${{ (needs.changes.result == 'cancelled' || needs.test-windows.result == 'cancelled' || needs.test-linux.result == 'cancelled') && 'ubuntu-latest' || 'pepper-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          CHANGES: ${{ needs.changes.result }}
          DRAFT: ${{ needs.changes.outputs.draft }}
          CODE: ${{ needs.changes.outputs.code }}
          HOLD: ${{ needs.changes.outputs.hold }}
          WINDOWS: ${{ needs.test-windows.result }}
          LINUX: ${{ needs.test-linux.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=$CHANGES draft=$DRAFT code=$CODE hold=$HOLD test-windows=$WINDOWS test-linux=$LINUX"

          verdict() {
            if [ "$CHANGES" != "success" ]; then
              echo "changes did not succeed ($CHANGES), so nothing was tested"
              return 1
            fi
            if [ "$DRAFT" = "true" ]; then
              # Ask again: if the PR left draft since `changes` looked, the
              # ready run decides, and this run must not leave a pass behind.
              if [ "$EVENT" = "pull_request" ] &&
                [ "$(gh api "repos/$REPO/pulls/$NUMBER" --jq .draft)" != "true" ]; then
                echo "the PR left draft during this run; the ready run tests it"
                return 1
              fi
              echo "draft PR: tests run once it is marked ready for review"
              return 0
            fi
            if [ "$CODE" = "false" ]; then
              echo "prose-only change: no tests needed"
              return 0
            fi
            if [ "$WINDOWS" != "success" ]; then
              echo "test-windows did not pass ($WINDOWS)"
              return 1
            fi
            if [ "$LINUX" != "success" ]; then
              echo "test-linux did not pass ($LINUX)"
              return 1
            fi
            echo "test-windows and test-linux passed"
            return 0
          }

          status=0
          message=$(verdict) || status=$?
          if [ "$status" = 0 ]; then
            conclusion=success
            echo "$message"
          else
            conclusion=failure
            echo "::error::$message"
          fi
          if [ -n "$HOLD" ]; then
            gh api "repos/$REPO/check-runs/$HOLD" -X PATCH \
              -f status=completed -f conclusion="$conclusion" \
              -f 'output[title]=Tested' -f "output[summary]=$message" > /dev/null
          fi
          exit "$status"
