# Publishes the minimal LLVM packages that CI installs.
#
# Only Windows actually needs one: its runner image has no usable LLVM (2.4 GB
# of LLVM 20 with no llvm-config.exe) and neither winget nor choco ships one,
# while Linux and macOS install a complete LLVM dev package from apt or
# Homebrew in seconds. So the default is windows alone; linux and macos remain
# available for a platform that ever loses that.
#
# Run this once per LLVM major that Windows CI should not have to download an
# archive for:
#
#   gh workflow run llvm-package.yml -f llvm=20
#
# Each platform provisions a full upstream LLVM, strips it to the pieces this
# project actually consumes (see scripts/package-llvm.*), and uploads the
# result as an asset on the `llvm-<version>` release.
#
# Sizes measured on Windows: 4.1 GB upstream tree -> 449 MB installed, 83 MB
# compressed. ci-provision-llvm.sh falls back to the upstream archive when no
# package has been published, so this is an optimization, never a prerequisite.
name: llvm-package

on:
  workflow_dispatch:
    inputs:
      llvm:
        description: "LLVM major to package (blank: the setup scripts' default)"
        required: false
        default: ""
      platforms:
        description: "Comma-separated: linux, macos, windows"
        required: false
        default: windows

concurrency:
  group: llvm-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: pepper-linux
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      version: ${{ steps.resolve.outputs.version }}
      major: ${{ steps.resolve.outputs.major }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        env:
          PLATFORMS: ${{ inputs.platforms }}
          LLVM: ${{ inputs.llvm }}
        run: |
          # Versions live in the setup scripts, next to the code that installs
          # them; never duplicate them here. Strip CR first: a Windows checkout
          # gives CRLF endings and an anchored match would return empty.
          read_sh() { tr -d '\r' < scripts/setup-llvm.sh | sed -nE "$1" | head -1; }
          read_ps1() { tr -d '\r' < scripts/setup-llvm.ps1 | sed -nE "$1" | head -1; }

          major="$LLVM"
          if [ -z "$major" ]; then
            major=$(read_ps1 "s/^\\\$DefaultLlvmMajor = '([^']+)'.*/\\1/p")
            [ -n "$major" ] || { echo "::error::cannot read \$DefaultLlvmMajor from setup-llvm.ps1"; exit 1; }
          fi

          # Digits only. The value is interpolated into the sed expressions
          # below, where anything else is matched as a regex rather than a
          # literal: `llvm=.*` would otherwise match the first row of both
          # tables, agree with itself, and be passed on to the setup scripts.
          case "$major" in
            ''|*[!0-9]*) echo "::error::llvm must be a major version number, got '$major'"; exit 1 ;;
          esac

          # Both scripts carry a major -> patch table, and each installs from
          # its own. ci-provision-llvm.sh asks for the asset named by the
          # Windows table, so a disagreement would publish under one version
          # while Windows CI requested another and silently fell back to an
          # archive install -- refuse to publish anything until they agree.
          version=$(read_sh "s/^ *$major\) echo \"([^\"]+)\".*/\\1/p")
          [ -n "$version" ] || { echo "::error::setup-llvm.sh has no version for LLVM $major"; exit 1; }
          win_version=$(read_ps1 "s/^ *'$major' = '([^']+)'.*/\\1/p")
          [ -n "$win_version" ] || { echo "::error::setup-llvm.ps1 has no version for LLVM $major"; exit 1; }
          if [ "$version" != "$win_version" ]; then
            echo "::error::LLVM $major differs: setup-llvm.sh=$version setup-llvm.ps1=$win_version"
            exit 1
          fi

          runners=''
          for platform in $(printf '%s' "$PLATFORMS" | tr ',' ' '); do
            case "$(printf '%s' "$platform" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
              linux|ubuntu)  runner=pepper-linux ;;
              macos|mac|osx) runner=pepper-macos ;;
              windows|win)   runner=pepper-windows ;;
              '')            continue ;;
              *) echo "::error::unknown platform '$platform'"; exit 1 ;;
            esac
            case ",$runners," in
              *",$runner,"*) ;;
              *) runners="${runners:+$runners,}$runner" ;;
            esac
          done
          [ -n "$runners" ] || { echo "::error::no platforms resolved"; exit 1; }

          matrix=$(printf '%s' "$runners" | tr ',' '\n' | sed 's/.*/"&"/' | paste -sd, - | sed 's/^/[/; s/$/]/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Packaging LLVM $version (major $major) for $matrix"

      # Created once, before the matrix fans out, so three concurrent uploads
      # cannot race to create the same release.
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="llvm-$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            printf '%s\n' \
              "Minimal LLVM $VERSION packages for CI, built by the llvm-package workflow." \
              "" \
              "Only the pieces this project links against: llvm-config, the component" \
              "libraries, the llvm-c headers, and on Windows LLVM-C.dll plus clang." \
              > notes.md
            gh release create "$tag" --title "LLVM $VERSION (CI packages)" --notes-file notes.md
          fi

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # The upstream Linux tree is 11.6 GB -- nearly three times the Windows
      # one, because its `bin/` alone is 9 GB of unstripped tools -- and this
      # job's peak is about 14.7 GB: that tree, the 1.4 GB archive, the ~200 MB
      # output, and the post-job cache save, which tars the archive to a second
      # file on the same filesystem while the tree is still present (1.48 GB
      # observed on the macOS leg). ubuntu-latest has ~13 GB free, so it ran
      # out mid-package, and so did the runner's own diagnostic log.
      #
      # Reclaim the preinstalled toolchains this job never touches; the `df`
      # lines are here so the log shows what was actually gained if a future
      # image changes what it ships. Only the producer pays this: consumers
      # install the package, which is why it exists. Deliberately not `set -e`
      # on the removals -- an image that drops one of these paths must not fail
      # the job.
      - name: Reclaim disk (Linux)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -BM --output=avail / | tail -1 | awk '{print "before: " $1}'
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift || true
          df -BM --output=avail / | tail -1 | awk '{print "after:  " $1}'

      # A full upstream install is the input to packaging, so this job pays the
      # cost CI is being spared. Cache it so repeat runs skip the download.
      - name: Cache LLVM archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

      - name: Cache LLVM archive (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.sh') }}-${{ matrix.os }}

      # --no-packages stops the Unix leg from *installing* an apt/brew LLVM to
      # package; it does not stop one already on the image from being adopted
      # (the pepper-macos runner has Homebrew llvm@20), which is what the version
      # assertion in the next step is for.
      # $env:MAJOR, not "$MAJOR": this step has no `shell:`, so on windows it
      # runs under pwsh, where a bare $MAJOR is an undefined PowerShell
      # variable and would expand to nothing.
      - name: Provision full LLVM (Windows)
        if: runner.os == 'Windows'
        env:
          MAJOR: ${{ needs.prepare.outputs.major }}
        run: pwsh -File scripts/setup-llvm.ps1 -Llvm $env:MAJOR

      - name: Provision full LLVM (Unix)
        if: runner.os != 'Windows'
        env:
          MAJOR: ${{ needs.prepare.outputs.major }}
        run: bash scripts/setup-llvm.sh --llvm "$MAJOR" --no-packages

      - name: Build package
        id: build
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # The platform only names the asset. The prefix is read back out of
          # the config the setup script just wrote, rather than re-derived: the
          # script may settle on a system LLVM (an apt or Homebrew prefix, or a
          # different major than the one asked for) and then never populate
          # ~/.local/share/pepper/llvm/<version> at all, so a re-derived path
          # would fail below at `du` with nothing explaining why.
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) platform=windows-x64 ;;
            Darwin)               platform="macos-$(uname -m)" ;;
            *)                    platform="linux-$(uname -m)" ;;
          esac

          asset="llvm-$VERSION-$platform.tar.xz"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

          config=.cargo/config.toml
          [ -f "$config" ] || { echo "::error::$config was not generated"; exit 1; }
          # Two transformations, both required: setup-llvm.ps1 writes this file
          # with Set-Content, whose line endings are CRLF, so an anchored match
          # fails without stripping CR; and TOML escapes Windows separators, so
          # the doubled backslashes have to be collapsed for the shell.
          prefix=$(tr -d '\r' < "$config" \
                   | sed -nE 's/^LLVM_SYS_[0-9]+_PREFIX = "(.*)"$/\1/p' \
                   | head -1 | sed 's|\\\\|\\|g')
          [ -n "$prefix" ] || { echo "::error::no LLVM_SYS_*_PREFIX in $config"; exit 1; }
          echo "  prefix: $prefix"

          # The asset is named from the requested major's version, but the
          # prefix is whatever provisioning settled on, and those can differ:
          # setup-llvm.sh adopts an already-installed supported major when the
          # requested one cannot be had, and the pepper-macos runner has Homebrew
          # llvm@20 preinstalled. Publishing LLVM 20 as llvm-18.1.8-* would be
          # undetectable afterwards, so compare before packaging.
          actual=$("$prefix/bin/llvm-config" --version)
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::provisioned LLVM $actual at $prefix, but the asset would be named for $VERSION"
            exit 1
          fi

          du -sm "$prefix" | awk '{print "  upstream prefix: " $1 " MB"}'
          if [ "$platform" = windows-x64 ]; then
            pwsh -File scripts/package-llvm.ps1 -Prefix "$prefix" -Output "$asset"
          else
            bash scripts/package-llvm.sh "$prefix" "$asset"
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: gh release upload "llvm-$VERSION" "$ASSET" --clobber
