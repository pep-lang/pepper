# Publishes the minimal LLVM packages that CI installs.
#
# Run this once per LLVM version bump:
#
#   gh workflow run llvm-package.yml
#
# Each platform provisions a full upstream LLVM, strips it to the pieces this
# project actually consumes (see scripts/package-llvm.*), and uploads the result
# as an asset on the `llvm-<version>` release. CI and platform-test then install
# that instead of the multi-gigabyte upstream tree -- which is what ran a Linux
# runner out of disk.
#
# Sizes measured on Windows: 4.1 GB upstream tree -> 449 MB installed, 83 MB
# compressed. Both CI workflows fall back to a full install when no package has
# been published, so this is an optimization, never a prerequisite.
name: llvm-package

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: linux, macos, windows"
        required: false
        default: linux,macos,windows

concurrency:
  group: llvm-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # The version pins live in the setup scripts; never duplicate them
          # here. Strip CR first: a Windows checkout gives CRLF endings and an
          # anchored match would return empty.
          version=$(tr -d '\r' < scripts/setup-llvm.sh | sed -nE 's/^LLVM_VERSION="([^"]+)".*/\1/p' | head -1)
          [ -n "$version" ] || { echo "::error::cannot read LLVM_VERSION"; exit 1; }

          # Each setup script owns its own pin, and ci-provision-llvm.sh asks
          # for the asset named by whichever pin belongs to its platform. If
          # the two ever drift, this job would publish under one version while
          # Windows CI requested another and silently fell back to a full
          # install -- so refuse to publish anything until they agree.
          win_version=$(tr -d '\r' < scripts/setup-llvm.ps1 \
                        | sed -nE "s/^\\\$LlvmVersion = '([^']+)'.*/\\1/p" | head -1)
          [ -n "$win_version" ] || { echo "::error::cannot read \$LlvmVersion from setup-llvm.ps1"; exit 1; }
          if [ "$version" != "$win_version" ]; then
            echo "::error::version pins disagree: setup-llvm.sh=$version setup-llvm.ps1=$win_version"
            exit 1
          fi

          runners=''
          for platform in $(printf '%s' "$PLATFORMS" | tr ',' ' '); do
            case "$(printf '%s' "$platform" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
              linux|ubuntu)  runner=ubuntu-latest ;;
              macos|mac|osx) runner=macos-latest ;;
              windows|win)   runner=windows-latest ;;
              '')            continue ;;
              *) echo "::error::unknown platform '$platform'"; exit 1 ;;
            esac
            case ",$runners," in
              *",$runner,"*) ;;
              *) runners="${runners:+$runners,}$runner" ;;
            esac
          done
          [ -n "$runners" ] || { echo "::error::no platforms resolved"; exit 1; }

          matrix=$(printf '%s' "$runners" | tr ',' '\n' | sed 's/.*/"&"/' | paste -sd, - | sed 's/^/[/; s/$/]/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Packaging LLVM $version for $matrix"

      # Created once, before the matrix fans out, so three concurrent uploads
      # cannot race to create the same release.
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="llvm-$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            printf '%s\n' \
              "Minimal LLVM $VERSION packages for CI, built by the llvm-package workflow." \
              "" \
              "Only the pieces this project links against: llvm-config, the component" \
              "libraries, the llvm-c headers, and on Windows LLVM-C.dll plus clang." \
              > notes.md
            gh release create "$tag" --title "LLVM $VERSION (CI packages)" --notes-file notes.md
          fi

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # The upstream Linux tree is 11.6 GB -- nearly three times the Windows
      # one, because its `bin/` alone is 9 GB of unstripped tools -- and this
      # job's peak is about 14.7 GB: that tree, the 1.4 GB archive, the ~200 MB
      # output, and the post-job cache save, which tars the archive to a second
      # file on the same filesystem while the tree is still present (1.48 GB
      # observed on the macOS leg). ubuntu-latest has ~13 GB free, so it ran
      # out mid-package, and so did the runner's own diagnostic log.
      #
      # Reclaim the preinstalled toolchains this job never touches; the `df`
      # lines are here so the log shows what was actually gained if a future
      # image changes what it ships. Only the producer pays this: consumers
      # install the package, which is why it exists. Deliberately not `set -e`
      # on the removals -- an image that drops one of these paths must not fail
      # the job.
      - name: Reclaim disk (Linux)
        if: runner.os == 'Linux'
        run: |
          df -BM --output=avail / | tail -1 | awk '{print "before: " $1}'
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift || true
          df -BM --output=avail / | tail -1 | awk '{print "after:  " $1}'

      # A full upstream install is the input to packaging, so this job pays the
      # cost CI is being spared. Cache it so repeat runs skip the download.
      - name: Cache LLVM archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

      - name: Cache LLVM archive (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.sh') }}-${{ matrix.os }}

      - name: Provision full LLVM (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File scripts/setup-llvm.ps1

      - name: Provision full LLVM (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/setup-llvm.sh

      - name: Build package
        id: build
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # The platform only names the asset. The prefix is read back out of
          # the config the setup script just wrote, rather than re-derived:
          # setup-llvm.sh prefers a matching *system* LLVM when it finds one
          # (llvm-config-22, brew llvm@22, /usr/lib/llvm-22) and then never
          # populates ~/.local/share/pepper/llvm/<version> at all, so a
          # re-derived path would fail here at `du` with nothing explaining why.
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) platform=windows-x64 ;;
            Darwin)               platform="macos-$(uname -m)" ;;
            *)                    platform="linux-$(uname -m)" ;;
          esac

          asset="llvm-$VERSION-$platform.tar.xz"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

          config=.cargo/config.toml
          [ -f "$config" ] || { echo "::error::$config was not generated"; exit 1; }
          # Two transformations, both required: setup-llvm.ps1 writes this file
          # with Set-Content, whose line endings are CRLF, so an anchored match
          # fails without stripping CR; and TOML escapes Windows separators, so
          # the doubled backslashes have to be collapsed for the shell.
          prefix=$(tr -d '\r' < "$config" \
                   | sed -nE 's/^LLVM_SYS_[0-9]+_PREFIX = "(.*)"$/\1/p' \
                   | head -1 | sed 's|\\\\|\\|g')
          [ -n "$prefix" ] || { echo "::error::no LLVM_SYS_*_PREFIX in $config"; exit 1; }
          echo "  prefix: $prefix"

          du -sm "$prefix" | awk '{print "  upstream prefix: " $1 " MB"}'
          if [ "$platform" = windows-x64 ]; then
            pwsh -File scripts/package-llvm.ps1 -Prefix "$prefix" -Output "$asset"
          else
            bash scripts/package-llvm.sh "$prefix" "$asset"
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: gh release upload "llvm-$VERSION" "$ASSET" --clobber
