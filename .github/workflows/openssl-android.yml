# Publishes the static OpenSSL that the tls module links on Android, built
# by scripts/openssl-android.sh for each Android ABI, as
# openssl-<version>-android.tar.gz (and its .sha256) on the
# `openssl-<version>` release. release-build.sh puts it in every toolchain,
# and `scripts/openssl-android.sh fetch runtime` in a checkout.
#
# Building OpenSSL takes minutes, so it is built once per version, not in
# every run that needs it. A run publishes only when the release lacks the
# archive, so changing OPENSSL_VERSION in the script publishes the new one:
#
#   - a pull request that changes the script or this file builds it, and,
#     from a branch of this repository, publishes it when it is missing, so
#     the pull request's own checks (and its merge's release) can fetch it;
#   - a push to main that changes them does the same;
#   - a dispatch with `force` builds and replaces the archive of the version
#     the script pins (after a change to its build flags, say):
#
#   gh workflow run openssl-android.yml -f force=true
name: openssl-android

on:
  workflow_dispatch:
    inputs:
      force:
        description: Replace the published archive
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/openssl-android.sh
      - .github/workflows/openssl-android.yml
  push:
    branches: [main]
    paths:
      - scripts/openssl-android.sh
      - .github/workflows/openssl-android.yml

concurrency:
  group: openssl-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          version=$(sed -nE 's/^OPENSSL_VERSION=([^ ]+)$/\1/p' scripts/openssl-android.sh)
          [ -n "$version" ] || { echo "::error::no OPENSSL_VERSION in scripts/openssl-android.sh"; exit 1; }
          tag="openssl-$version"
          asset="openssl-$version-android.tar.gz"
          published=false
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$asset"; then
            published=true
          fi
          # A fork's pull request has a read-only token: it only builds.
          publish=true
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$REPO" ]; then
            publish=false
          fi
          if [ "$published" = true ] && [ "$FORCE" != true ]; then
            publish=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      # The image's NDK (ANDROID_NDK_HOME); the libraries need nothing of
      # a particular release.
      - name: Build
        timeout-minutes: 40
        run: bash -euxo pipefail scripts/openssl-android.sh build "$ANDROID_NDK_HOME" dist

      - uses: actions/upload-artifact@v7
        with:
          name: openssl-android
          path: dist/
          retention-days: 3

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euxo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            printf '%s\n' \
              "OpenSSL $VERSION built as static libraries for each Android ABI by the openssl-android workflow (scripts/openssl-android.sh)." \
              "" \
              "OpenSSL is under the Apache License 2.0; its LICENSE.txt is in the archive." \
              > notes.md
            gh release create "$TAG" --title "OpenSSL $VERSION for Android" --notes-file notes.md --latest=false
          fi
          gh release upload "$TAG" dist/* --clobber
