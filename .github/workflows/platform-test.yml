# One-off cross-platform runs, for checking a change on an operating system
# other than the one you develop on.
#
#   gh workflow run platform-test.yml -f platforms=macos -f script="cargo test --workspace"
#
# Add `--ref <branch>` to test un-merged work. `workflow_dispatch` only
# registers once this file is on the default branch, but the run then executes
# the workflow definition found at `--ref`, not the default branch's -- so
# `--ref` selects both the code under test and the workflow running it.
#
# Dispatch-only on purpose. A `push` trigger cannot be filtered by commit
# message, so every push would queue a job just to discover there was nothing
# to do, and the command would have to be parsed back out of prose.
#
# None of these jobs are required checks: this is a diagnostic. All three
# platforms pass end to end, so a red run here is a regression rather than a
# known gap. macOS runners bill at several times the Linux rate on private
# repositories, so name the platform you need rather than defaulting to all
# three.
name: platform-test

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: linux, macos, windows"
        required: false
        default: linux,macos,windows
      script:
        description: "Command to run (bash, from the repo root)"
        required: false
        default: cargo test --workspace
      provision:
        description: "Provision LLVM before running the script (false to probe the bare image)"
        required: false
        default: "true"

concurrency:
  group: platform-test-${{ github.ref }}
  cancel-in-progress: false

# The requested script runs with GITHUB_TOKEN in its environment, and nothing
# here needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Turns the platform list into a matrix, rejecting anything unrecognized so a
  # typo fails immediately instead of quietly running somewhere unintended.
  prepare:
    runs-on: pepper-linux
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          runners=''
          for platform in $(printf '%s' "$PLATFORMS" | tr ',' ' '); do
            case "$(printf '%s' "$platform" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
              linux|ubuntu)  runner=pepper-linux ;;
              macos|mac|osx) runner=macos-latest ;;
              windows|win)   runner=pepper-windows ;;
              '')            continue ;;
              *)
                echo "::error::unknown platform '$platform' (expected linux, macos or windows)"
                exit 1
                ;;
            esac
            case ",$runners," in
              *",$runner,"*) ;;                       # already selected
              *) runners="${runners:+$runners,}$runner" ;;
            esac
          done

          if [ -z "$runners" ]; then
            echo "::error::no platforms resolved from '$PLATFORMS'"
            exit 1
          fi

          matrix=$(printf '%s' "$runners" | tr ',' '\n' | sed 's/.*/"&"/' | paste -sd, - | sed 's/^/[/; s/$/]/')
          echo "Platforms: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Summarize
        env:
          SCRIPT: ${{ inputs.script }}
          MATRIX: ${{ steps.resolve.outputs.matrix }}
        run: |
          {
            echo "### platform-test"
            echo
            echo "- Platforms: \`$MATRIX\`"
            echo "- Script: \`$SCRIPT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  run:
    needs: prepare
    strategy:
      # One platform failing is usually the answer you were looking for, not a
      # reason to abandon the others.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Was 60. A hung job is the most expensive failure mode here -- it is
    # silent (GitHub exposes no partial log for a running step) and it burns a
    # whole investigation round.
    #
    # The step caps below must sum to less than this, or the job is cancelled
    # before either of them fires: a cancelled job reports neither which phase
    # stalled nor the diagnostics below, since `failure()` is false under
    # cancellation.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          uname -a || true

      # Keying on the setup script's hash rather than a hardcoded version:
      # a hardcoded key still hits exactly after the pinned LLVM version is
      # bumped, and actions/cache skips its save on an exact hit, so the new
      # archive would never be cached and every run would re-download it.
      - name: Cache LLVM download (Windows)
        if: runner.os == 'Windows' && inputs.provision != 'false'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.ps1') }}-windows-x64

      - name: Cache LLVM download (Unix)
        if: runner.os != 'Windows' && inputs.provision != 'false'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pepper/cache
          key: llvm-archive-${{ hashFiles('scripts/setup-llvm.sh') }}-${{ matrix.os }}

      # Windows installs the minimal LLVM package when one has been published,
      # else the upstream archive. Linux and macOS install from apt or
      # Homebrew, which takes seconds.
      #
      # Skippable because the question is sometimes what the bare image already
      # has -- which package-manager LLVM it can reach, and whether that is
      # enough to build with.
      - name: Provision LLVM
        if: inputs.provision != 'false'
        # 10 + 15 < the job's 30, so a stall trips the step -- naming the
        # phase and running diagnostics -- rather than cancelling the job.
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-provision-llvm.sh

      # The command is supplied by someone with write access (dispatch requires
      # it), and reaches the shell through the environment rather than template
      # interpolation.
      #
      # `-e -u -o pipefail -x` because every run of this workflow costs minutes
      # of wall clock: without -e a script keeps going after the failure you
      # care about and buries it, and without -x the log shows output with no
      # indication of which command produced it. Both cost investigation
      # rounds. A script that genuinely needs to continue past a failure can
      # say so with `|| true`.
      - name: Run requested script
        timeout-minutes: 15
        shell: bash
        env:
          SCRIPT: ${{ inputs.script }}
          PLATFORM: ${{ matrix.os }}
        run: |
          echo "Running on $PLATFORM: $SCRIPT"
          bash -euxo pipefail -c "$SCRIPT"

      # Only when the job did not pass, so a green run stays readable. This is
      # the state a failure is almost always about, and collecting it here
      # saves re-dispatching the whole job to ask what LLVM it had.
      - name: Diagnostics
        # `always()` would also run this after a clean pass; `cancelled()` is
        # included because a job cancelled by the timeout is exactly when the
        # state below is wanted, and `failure()` alone is false then.
        if: failure() || cancelled()
        shell: bash
        run: |
          set +e
          echo "::group::toolchain"
          rustc -vV; cargo -V
          echo "::endgroup::"

          echo "::group::host"
          uname -a
          sw_vers 2>/dev/null
          [ -r /etc/os-release ] && cat /etc/os-release
          df -m . | tail -2
          echo "::endgroup::"

          echo "::group::LLVM as cargo sees it"
          cat .cargo/config.toml 2>/dev/null || echo "no .cargo/config.toml"
          prefix=$(tr -d '\r' < .cargo/config.toml 2>/dev/null \
                   | sed -nE 's/^LLVM_SYS_[0-9]+_PREFIX = "(.*)"$/\1/p' \
                   | head -1 | sed 's|\\\\|\\|g')
          if [ -n "$prefix" ]; then
            echo "prefix: $prefix"
            "$prefix/bin/llvm-config" --version --targets-built --libdir 2>&1 | sed 's/^/  /'
          fi
          for cfg in llvm-config llvm-config-20 llvm-config-19 llvm-config-18; do
            path=$(command -v "$cfg" 2>/dev/null) && echo "PATH $cfg: $path ($("$cfg" --version 2>&1))"
          done
          echo "::endgroup::"

          echo "::group::link driver"
          # The driver prefers the prefix's clang and falls back to PATH, so
          # which one answered matters when a link fails.
          [ -n "$prefix" ] && [ -x "$prefix/bin/clang" ] && "$prefix/bin/clang" --version | head -2
          command -v clang >/dev/null && clang --version | head -2
          echo "::endgroup::"

          echo "::group::build artifacts"
          ls -l target/debug 2>/dev/null | head -20
          ls -l .pep/build 2>/dev/null | head -20
          echo "::endgroup::"
