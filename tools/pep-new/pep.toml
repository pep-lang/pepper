[package]
name = "pep_new"
description = "Starts a project in a new folder, run as `pepper new`"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper"

[build]
entry = "main.pep"
output = "pep-new"
# `scaffold`, `syntax` and `tool_testing` are folders beside this one.
include = [".."]
