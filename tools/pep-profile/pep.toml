[package]
name = "pep_profile"
description = "Profiles a program and writes a flame graph, run as `pepper profile`"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper"

[build]
entry = "main.pep"
output = "pep-profile"
# `toolchain` is a folder beside this one.
include = [".."]
