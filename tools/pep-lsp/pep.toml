[package]
name = "pep_lsp"
version = "0.3.0"
description = "The Pepper language server, written in Pepper on the lsp package (#225)"
license = "MIT"
repository = "https://github.com/justinboswell/pepper"

[build]
entry = "main.pep"
output = "pep-lsp"
# `compiler.parse` and the other shared modules are folders beside this one.
include = [".."]

[dependencies]
lsp = { github = "justinboswell/pepper-lsp", branch = "main" }
