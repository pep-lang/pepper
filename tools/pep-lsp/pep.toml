[package]
name = "pep_lsp"
version = "0.3.0"
description = "The Pepper language server, written in Pepper on the lsp package"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper"

[build]
entry = "main.pep"
output = "pep-lsp"
# `compiler.parse` and the other shared modules are folders beside this one.
include = [".."]

[dependencies]
lsp = { github = "pep-lang/pepper-lsp", branch = "main" }
