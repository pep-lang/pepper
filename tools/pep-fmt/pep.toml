[package]
name = "pep_fmt"
description = "Formats Pepper source in the standard style, run as `pepper fmt`"
license = "MIT"
repository = "https://github.com/pep-lang/pepper"

[build]
entry = "main.pep"
output = "pep-fmt"
# `compiler.parse`, `syntax` and the other shared modules are folders beside this one.
include = [".."]
