[package]
name = "pep_package"
version = "0.3.0"
description = "The package manager, run as `pepper package`"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper"

[build]
entry = "main.pep"
output = "pep-package"
# `toolchain` and `tool_testing` are folders beside this one.
include = [".."]

[dependencies]
semver = { github = "pep-lang/pepper-semver", version = "1.0.0" }
