[package]
name = "compiler"
version = "0.1.0"
description = "The Pepper compiler written in Pepper (#225), built as `pepc`"
license = "MIT"
repository = "https://github.com/justinboswell/pepper"

[build]
entry = "main.pep"
output = "pepc"
# `compiler.parse` and the other modules are folders beside this one.
include = [".."]

[dependencies]
llvm = { github = "justinboswell/pepper-llvm", branch = "main" }
