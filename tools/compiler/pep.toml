[package]
name = "compiler"
version = "0.1.0"
description = "The Pepper compiler written in Pepper, built as `pepc`"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper"

[build]
entry = "main.pep"
output = "pepc"
# `compiler.parse` and the other modules are folders beside this one.
include = [".."]

[dependencies]
llvm = { github = "pep-lang/pepper-llvm", branch = "main" }
