[package]
name = "pepper-codegen"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pepper-sema = { path = "../pepper-sema" }
pepper-support = { path = "../pepper-support" }

# `target-all` (inkwell's default) emits initializers for every LLVM target,
# including ones a given LLVM build omits. Pepper only targets x86.
#
# Windows links LLVM-C.dll instead of LLVM's static libs -- those are built
# against the static CRT and mixing CRTs corrupts the heap. `no-llvm-linking`
# hands linkage to build.rs; see the comment there.
[target.'cfg(windows)'.dependencies]
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1-no-llvm-linking", "target-x86"] }

[target.'cfg(not(windows))'.dependencies]
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1", "target-x86"] }

[dev-dependencies]
pepper-parser = { path = "../pepper-parser" }
