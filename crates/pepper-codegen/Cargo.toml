[package]
name = "pepper-codegen"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pepper-sema = { path = "../pepper-sema" }
pepper-support = { path = "../pepper-support" }

# `target-all` (inkwell's default) emits initializers for every LLVM target,
# including ones a given LLVM build omits, which fails at link time with
# unresolved LLVMInitialize<Target>*. So the backend is requested per host
# architecture below, and crates/pepper-codegen/src/target.rs registers it.
# Asking for both everywhere would require every LLVM this builds against --
# including a system one nobody here chose -- to carry both backends.
#
# The LLVM version is a feature, not a fixed dependency: inkwell requires
# exactly one `llvmNN-1` feature, and which LLVM is cheaply available differs
# per platform -- apt has 18/19/20, Homebrew has `llvm@18` through `llvm@22`,
# Windows runner image has no usable LLVM at all. See scripts/setup-llvm.*.
inkwell = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
inkwell = { version = "0.10", default-features = false, features = ["target-x86"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
inkwell = { version = "0.10", default-features = false, features = ["target-aarch64"] }

# Windows links LLVM-C.dll instead of LLVM's static libs -- those are built
# against the static CRT and mixing CRTs corrupts the heap. `no-llvm-linking`
# hands linkage to build.rs; see the comment there.
#
# It has to be requested here rather than through inkwell's
# `llvmNN-1-no-llvm-linking` features, because a feature cannot expand to a
# different dependency feature per target -- which is the whole reason the
# version features below can be one name instead of one per platform. Cargo
# unifies these with the llvm-sys instance inkwell resolves (same package,
# same major), so `no-llvm-linking` reaches it without a second copy. Only the
# one matching the selected version is enabled; the rest stay unbuilt.
[target.'cfg(windows)'.dependencies]
llvm-sys-181 = { package = "llvm-sys", version = "181", features = ["no-llvm-linking"], optional = true }
llvm-sys-191 = { package = "llvm-sys", version = "191", features = ["no-llvm-linking"], optional = true }
llvm-sys-201 = { package = "llvm-sys", version = "201", features = ["no-llvm-linking"], optional = true }
llvm-sys-211 = { package = "llvm-sys", version = "211", features = ["no-llvm-linking"], optional = true }
llvm-sys-221 = { package = "llvm-sys", version = "221", features = ["no-llvm-linking"], optional = true }

[features]
# LLVM 20 is the default because it is the cheapest to obtain on two of the
# three platforms: `apt install llvm-20-dev` takes 4-8s on ubuntu-24.04 and
# Homebrew's llvm@20 is preinstalled on macos-latest. Windows has to fetch an
# archive whatever the version.
default = ["llvm20-1"]
llvm18-1 = ["inkwell/llvm18-1", "llvm-sys-181"]
llvm19-1 = ["inkwell/llvm19-1", "llvm-sys-191"]
llvm20-1 = ["inkwell/llvm20-1", "llvm-sys-201"]
llvm21-1 = ["inkwell/llvm21-1", "llvm-sys-211"]
llvm22-1 = ["inkwell/llvm22-1", "llvm-sys-221"]

[dev-dependencies]
pepper-parser = { path = "../pepper-parser" }
