[package]
name = "pepper-driver"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pepper-parser = { path = "../pepper-parser" }
pepper-sema = { path = "../pepper-sema" }
pepper-support = { path = "../pepper-support" }
pepper-codegen = { path = "../pepper-codegen" }
clap.workspace = true

# See crates/pepper-codegen/Cargo.toml + build.rs for why Windows links the DLL.
[target.'cfg(windows)'.dependencies]
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1-no-llvm-linking", "target-x86"] }

[target.'cfg(not(windows))'.dependencies]
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1", "target-x86"] }
