[workspace]
resolver = "2"
members = [
    ".",
    "crates/pepper-parser",
    "crates/pepper-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
itertools = "0.14.0"
winnow = "1.0.3"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }

[package]
name = "pepper"
version.workspace = true
edition.workspace = true

[dependencies]
pepper-parser = { path = "crates/pepper-parser" }
clap.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pepper"
path = "src/main.rs"
