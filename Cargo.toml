[workspace]
resolver = "2"
members = [
    ".",
    "crates/pepper-parser",
    "crates/pepper-sema",
    "crates/pepper-codegen",
    "crates/pepper-driver",
    "crates/pepper-files",
    # `cargo run -p xtask -- setup` provisions LLVM. Dependency-free on
    # purpose, so it builds before any LLVM exists.
    "xtask",
    # Language server: parser + sema only, no LLVM linkage.
    "tools/lsp",
    # Documentation site builder: parser only, no LLVM linkage.
    "tools/docgen",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
itertools = "0.14.0"
winnow = "1.0.3"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }
serde_json = "1"

[package]
name = "pepper"
version.workspace = true
edition.workspace = true

[dependencies]
pepper-driver = { path = "crates/pepper-driver", default-features = false }
clap.workspace = true

# The LLVM version for the whole build, selected here so a single
# `--features llvm19-1` at the workspace root reaches every crate that links
# LLVM. Exactly one must be active: inkwell rejects two, with an error naming
# the conflicting llvm-sys crates.
#
# Default is LLVM 20 -- `apt install llvm-20-dev` on ubuntu-24.04 and the
# preinstalled Homebrew llvm@20 on macos-latest both provide it. Run
# scripts/setup-llvm.sh (or .ps1) and it will tell you which version it found
# and, if it is not the default, the exact flag to pass.
[features]
default = ["llvm20-1"]
llvm18-1 = ["pepper-driver/llvm18-1"]
llvm19-1 = ["pepper-driver/llvm19-1"]
llvm20-1 = ["pepper-driver/llvm20-1"]
llvm21-1 = ["pepper-driver/llvm21-1"]
llvm22-1 = ["pepper-driver/llvm22-1"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pepper"
path = "src/main.rs"

# The front end parses and checks the whole runtime for every program the
# tests compile, and unoptimized it is most of the suite's run time: level 1
# halves it (43s to 28s on 4 cores) without slowing an edit-and-rebuild,
# which is dominated by linking the test binaries. Debug info is kept.
[profile.dev.package.pepper-parser]
opt-level = 1

[profile.dev.package.pepper-sema]
opt-level = 1

[profile.dev.package.pepper-files]
opt-level = 1
